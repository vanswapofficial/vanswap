<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Remove Liquidity - Core Chain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #888;
            text-align: center;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .info-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .info-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;
            color: #4CAF50;
            word-break: break-all;
            font-family: monospace;
        }

        .warning {
            background: rgba(255, 100, 100, 0.15);
            border-left: 3px solid #ff6464;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #ff9999;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #ddd;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
            background: rgba(0, 0, 0, 0.7);
        }

        input::placeholder {
            color: #555;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .connect-btn {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            margin-bottom: 16px;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            color: #4CAF50;
            display: block;
        }

        .status.error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff8888;
            display: block;
        }

        .status.loading {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196F3;
            color: #2196F3;
            display: block;
        }

        .wallet-info {
            background: rgba(33, 150, 243, 0.1);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #2196F3;
            text-align: center;
            word-break: break-all;
        }

        .network-badge {
            display: inline-block;
            background: #4CAF50;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }

        hr {
            border-color: rgba(255, 255, 255, 0.1);
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔓 Remove Liquidity <span class="network-badge">Core Chain</span></h1>
        <div class="subtitle">Jaringan Core (Chain ID: 1116)</div>

        <div class="info-box">
            <div class="info-label">Router Contract</div>
            <div class="info-value">0xc885C4a8B112B8a165338566421c685024Ec44F9</div>
        </div>

        <div class="warning">
            ⚠️ Pastikan Anda terhubung ke jaringan Core Chain (Chain ID: 1116) dan memiliki token LP yang ingin di-remove.
        </div>

        <button id="connectWallet" class="connect-btn">🔌 Connect Wallet (MetaMask)</button>
        
        <div id="walletStatus" style="display: none;" class="wallet-info"></div>

        <div id="removeForm" style="display: none;">
            <div class="form-group">
                <label>📝 Alamat Token LP (Liquidity Provider Token)</label>
                <input type="text" id="lpTokenAddress" placeholder="0x..." value="">
            </div>

            <div class="form-group">
                <label>💰 Jumlah Token LP yang akan di-remove</label>
                <input type="number" id="lpAmount" placeholder="Contoh: 1.5" step="any">
            </div>

            <div class="form-group">
                <label>⏰ Slippage tolerance (%)</label>
                <input type="number" id="slippage" placeholder="0.5" value="0.5" step="0.1">
            </div>

            <button id="removeLiquidityBtn">💧 Remove Liquidity</button>
        </div>

        <div id="statusMessage" class="status"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.1/ethers.umd.min.js"></script>
    <script>
        // ============ KONFIGURASI ============
        const CORE_CHAIN_ID = "0x45c"; // 1116 in hex
        const CORE_CHAIN_NAME = "Core Chain";
        const CORE_RPC = "https://rpc.coredao.org";
        const ROUTER_ADDRESS = "0xc885C4a8B112B8a165338566421c685024Ec44F9";

        // Minimal ABI untuk Router (fungsi removeLiquidity)
        const ROUTER_ABI = [
            "function removeLiquidity(address tokenA, address tokenB, uint liquidity, uint amountAMin, uint amountBMin, address to, uint deadline) external returns (uint amountA, uint amountB)",
            "function removeLiquidityETH(address token, uint liquidity, uint amountTokenMin, uint amountETHMin, address to, uint deadline) external returns (uint amountToken, uint amountETH)"
        ];

        // ERC20 minimal ABI untuk approve dan balance
        const ERC20_ABI = [
            "function approve(address spender, uint256 amount) external returns (bool)",
            "function allowance(address owner, address spender) external view returns (uint256)",
            "function balanceOf(address account) external view returns (uint256)",
            "function decimals() external view returns (uint8)",
            "function symbol() external view returns (string)"
        ];

        // State variables
        let provider, signer, userAddress;
        let isConnected = false;

        // DOM Elements
        const connectBtn = document.getElementById('connectWallet');
        const removeForm = document.getElementById('removeForm');
        const walletStatusDiv = document.getElementById('walletStatus');
        const statusDiv = document.getElementById('statusMessage');
        const removeBtn = document.getElementById('removeLiquidityBtn');
        const lpTokenInput = document.getElementById('lpTokenAddress');
        const lpAmountInput = document.getElementById('lpAmount');
        const slippageInput = document.getElementById('slippage');

        // Helper: show status message
        function showStatus(message, type = 'loading') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            if (type !== 'loading') {
                setTimeout(() => {
                    if (statusDiv.className === `status ${type}`) {
                        statusDiv.style.display = 'none';
                        statusDiv.className = 'status';
                    }
                }, 8000);
            }
        }

        // Helper: format error
        function showError(error) {
            console.error(error);
            let errorMsg = error.message || String(error);
            if (errorMsg.includes('user rejected')) {
                errorMsg = 'Transaksi dibatalkan oleh user.';
            } else if (errorMsg.includes('insufficient')) {
                errorMsg = 'Saldo token LP tidak mencukupi.';
            }
            showStatus(`❌ Error: ${errorMsg}`, 'error');
        }

        // Check and switch to Core Chain
        async function ensureCoreNetwork() {
            if (!window.ethereum) throw new Error('MetaMask tidak terinstall!');
            
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });
            if (chainId !== CORE_CHAIN_ID) {
                showStatus('Mengganti ke jaringan Core Chain...', 'loading');
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: CORE_CHAIN_ID }],
                    });
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        // Add network
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: CORE_CHAIN_ID,
                                chainName: CORE_CHAIN_NAME,
                                nativeCurrency: { name: 'CORE', symbol: 'CORE', decimals: 18 },
                                rpcUrls: [CORE_RPC],
                                blockExplorerUrls: ['https://scan.coredao.org/']
                            }]
                        });
                    } else {
                        throw switchError;
                    }
                }
                return true;
            }
            return true;
        }

        // Connect Wallet
        async function connectWallet() {
            try {
                if (!window.ethereum) {
                    alert('Mohon install MetaMask terlebih dahulu!');
                    return;
                }

                showStatus('Menghubungkan ke wallet...', 'loading');
                
                await ensureCoreNetwork();
                
                provider = new ethers.providers.Web3Provider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                userAddress = accounts[0];
                signer = provider.getSigner();
                
                isConnected = true;
                
                // Update UI
                connectBtn.textContent = '✅ Wallet Terhubung';
                connectBtn.disabled = true;
                connectBtn.style.opacity = '0.7';
                
                walletStatusDiv.style.display = 'block';
                walletStatusDiv.innerHTML = `🔗 Address: ${userAddress.slice(0, 8)}...${userAddress.slice(-6)}<br>🌐 Jaringan: Core Chain (1116)`;
                
                removeForm.style.display = 'block';
                showStatus('✓ Wallet berhasil terhubung! Silakan masukkan detail token LP.', 'success');
                
                // Listen for account/network changes
                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts.length === 0) {
                        resetConnection();
                    } else {
                        userAddress = accounts[0];
                        walletStatusDiv.innerHTML = `🔗 Address: ${userAddress.slice(0, 8)}...${userAddress.slice(-6)}<br>🌐 Jaringan: Core Chain (1116)`;
                        showStatus('Akun berubah, silakan periksa kembali.', 'success');
                    }
                });
                
                window.ethereum.on('chainChanged', () => {
                    window.location.reload();
                });
                
            } catch (error) {
                showError(error);
                resetConnection();
            }
        }

        function resetConnection() {
            isConnected = false;
            connectBtn.textContent = '🔌 Connect Wallet (MetaMask)';
            connectBtn.disabled = false;
            connectBtn.style.opacity = '1';
            removeForm.style.display = 'none';
            walletStatusDiv.style.display = 'none';
            userAddress = null;
            provider = null;
            signer = null;
        }

        // Get LP token info (balance, decimals)
        async function getLPInfo(lpAddress, userAddr) {
            try {
                const lpContract = new ethers.Contract(lpAddress, ERC20_ABI, provider);
                const balance = await lpContract.balanceOf(userAddr);
                const decimals = await lpContract.decimals();
                const symbol = await lpContract.symbol();
                return { balance, decimals, symbol, contract: lpContract };
            } catch (err) {
                console.error("Gagal membaca token LP:", err);
                return null;
            }
        }

        // Check allowance and approve if needed
        async function ensureApproval(lpAddress, amount, signerWallet) {
            try {
                const lpContract = new ethers.Contract(lpAddress, ERC20_ABI, signerWallet);
                const allowance = await lpContract.allowance(userAddress, ROUTER_ADDRESS);
                
                if (allowance.lt(amount)) {
                    showStatus('⏳ Meminta approval token LP...', 'loading');
                    const approveTx = await lpContract.approve(ROUTER_ADDRESS, ethers.constants.MaxUint256);
                    await approveTx.wait();
                    showStatus('✓ Approval berhasil!', 'success');
                    return true;
                }
                return true;
            } catch (err) {
                throw new Error(`Approval gagal: ${err.message}`);
            }
        }

        // Main function to remove liquidity
        async function removeLiquidity() {
            if (!isConnected) {
                showStatus('Silakan connect wallet terlebih dahulu!', 'error');
                return;
            }
            
            const lpTokenAddress = lpTokenInput.value.trim();
            const lpAmountStr = lpAmountInput.value.trim();
            const slippagePercent = parseFloat(slippageInput.value);
            
            if (!lpTokenAddress || !ethers.utils.isAddress(lpTokenAddress)) {
                showStatus('Masukkan alamat token LP yang valid (format 0x...)', 'error');
                return;
            }
            
            if (!lpAmountStr || isNaN(parseFloat(lpAmountStr)) || parseFloat(lpAmountStr) <= 0) {
                showStatus('Masukkan jumlah token LP yang valid', 'error');
                return;
            }
            
            if (isNaN(slippagePercent) || slippagePercent < 0) {
                showStatus('Masukkan slippage tolerance yang valid', 'error');
                return;
            }
            
            try {
                removeBtn.disabled = true;
                removeBtn.textContent = '⏳ Memproses...';
                
                // Get signer
                const currentSigner = signer;
                const user = userAddress;
                
                // Get LP token info
                const lpInfo = await getLPInfo(lpTokenAddress, user);
                if (!lpInfo) {
                    throw new Error('Tidak dapat membaca info token LP. Pastikan alamat benar dan Anda memiliki token tersebut.');
                }
                
                const lpBalance = lpInfo.balance;
                const lpDecimals = lpInfo.decimals;
                const lpAmountWei = ethers.utils.parseUnits(lpAmountStr, lpDecimals);
                
                // Check balance
                if (lpBalance.lt(lpAmountWei)) {
                    throw new Error(`Saldo token LP tidak mencukupi. Saldo Anda: ${ethers.utils.formatUnits(lpBalance, lpDecimals)} ${lpInfo.symbol}`);
                }
                
                showStatus(`Saldo LP: ${ethers.utils.formatUnits(lpBalance, lpDecimals)} ${lpInfo.symbol}`, 'loading');
                
                // === Kita perlu mendeteksi pasangan token dari pool LP ===
                // Karena router memerlukan tokenA dan tokenB, kita coba dengan asumsi umum
                // Openex mungkin menggunakan pasangan token tertentu. User harus memasukkan pasangan token.
                // Untuk kemudahan, kita buat prompt input tokenA dan tokenB manual karena ABI removeLiquidity membutuhkannya.
                
                // Solusi: Minta user memasukkan alamat kedua token (tokenA dan tokenB)
                // Tampilkan form tambahan secara dinamis
                showStatus('🔍 Memerlukan informasi pasangan token... Silakan isi token A dan token B di prompt.', 'loading');
                
                // Simpler approach: Use prompt for token addresses (since we don't have pool info from just LP token easily)
                // For better UX, we'll ask user to input token pair
                const tokenA = prompt("Masukkan alamat Token A (misal: 0x... untuk CORE atau token lain):", "0x...");
                if (!tokenA || !ethers.utils.isAddress(tokenA)) {
                    throw new Error("Alamat Token A tidak valid.");
                }
                const tokenB = prompt("Masukkan alamat Token B:", "0x...");
                if (!tokenB || !ethers.utils.isAddress(tokenB)) {
                    throw new Error("Alamat Token B tidak valid.");
                }
                
                // Determine if one of them is native coin (ETH/CORE)
                const isNativeETH = (tokenA === ethers.constants.AddressZero || tokenB === ethers.constants.AddressZero);
                const nativeTokenAddress = ethers.constants.AddressZero;
                
                // Get amounts min based on slippage
                const slippageFactor = 1 - (slippagePercent / 100);
                const deadline = Math.floor(Date.now() / 1000) + 1200; // 20 mins
                
                const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, currentSigner);
                
                // Check if liquidity is for ETH pair or token-token
                let tx;
                if (isNativeETH) {
                    // Token yang bukan native
                    const token = tokenA === nativeTokenAddress ? tokenB : tokenA;
                    showStatus(`Menghapus liquidity ETH/${token}...`, 'loading');
                    
                    // Untuk removeLiquidityETH, kita perlu estimate amount minimal. 
                    // Karena kita tidak punya data reserve, kita set 0 dulu dan beri warning.
                    showStatus('⚠️ Karena keterbatasan informasi pool, amountMin di-set ke 0. Jika transaksi gagal karena slippage, coba lagi dengan setting slippage lebih besar atau masukkan manual amount min nanti.', 'warning');
                    const amountTokenMin = 0;
                    const amountETHMin = 0;
                    
                    tx = await router.removeLiquidityETH(
                        token,
                        lpAmountWei,
                        amountTokenMin,
                        amountETHMin,
                        userAddress,
                        deadline
                    );
                } else {
                    // Token-Token pair
                    showStatus(`Menghapus liquidity ${tokenA}/${tokenB}...`, 'loading');
                    const amountAMin = 0;
                    const amountBMin = 0;
                    
                    tx = await router.removeLiquidity(
                        tokenA,
                        tokenB,
                        lpAmountWei,
                        amountAMin,
                        amountBMin,
                        userAddress,
                        deadline
                    );
                }
                
                showStatus('Transaksi dikirim, menunggu konfirmasi...', 'loading');
                const receipt = await tx.wait();
                
                if (receipt.status === 1) {
                    showStatus(`✅ Berhasil menghapus liquidity! Tx: ${receipt.transactionHash.slice(0, 10)}...${receipt.transactionHash.slice(-8)}`, 'success');
                } else {
                    throw new Error('Transaksi gagal di blockchain');
                }
                
            } catch (error) {
                showError(error);
            } finally {
                removeBtn.disabled = false;
                removeBtn.textContent = '💧 Remove Liquidity';
            }
        }
        
        // Add event listener to connect button
        connectBtn.addEventListener('click', connectWallet);
        removeBtn.addEventListener('click', removeLiquidity);
        
        // Auto detect if already connected?
        if (window.ethereum && window.ethereum.selectedAddress) {
            // Optional: auto connect
            setTimeout(() => {
                if (!isConnected) {
                    // Do not auto connect to avoid intrusive, but show hint
                    console.log("Klik tombol connect untuk mulai");
                }
            }, 500);
        }
        
        // Instructions for user
        console.log("Ready - Openex Remove Liquidity Tool for Core Chain");
    </script>
</body>
</html>
