<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cek Saldo Wallet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0B0E11;color:#fff;padding:20px;min-height:100vh}
h1{font-size:20px;margin-bottom:4px}
p.sub{color:#8A8F98;font-size:13px;margin-bottom:16px}
textarea{width:100%;background:#1A1D22;border:1.5px solid #2A2F38;border-radius:12px;padding:14px;color:#fff;font-size:14px;font-family:monospace;resize:vertical;min-height:80px;outline:none}
textarea:focus{border-color:#3375BB}
button{width:100%;padding:15px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#3375BB,#05A4FF);color:#fff;margin-top:12px}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:#1A1D22;border-radius:12px;padding:14px;margin-top:14px;border:1px solid #2A2F38}
.label{font-size:11px;color:#8A8F98;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.value{font-size:13px;font-family:monospace;word-break:break-all;line-height:1.5}
.row{display:flex;align-items:center;gap:12px;padding:14px;background:#1A1D22;border-radius:12px;margin-top:8px;border:1px solid #2A2F38}
.ico{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.info{flex:1;min-width:0}
.nm{font-size:14px;font-weight:600}
.sy{font-size:11px;color:#8A8F98}
.bal{text-align:right;font-family:monospace;font-size:13px}
.err{background:rgba(255,77,77,.1);border:1px solid rgba(255,77,77,.3);color:#FF4D4D;padding:12px;border-radius:10px;font-size:13px;margin-top:12px}
.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#22C55E;padding:12px;border-radius:10px;font-size:13px;margin-top:12px}
</style>
</head>
<body>

<h1>Cek Saldo Wallet</h1>
<p class="sub">Paste mnemonic (12 atau 24 kata), lalu klik Cek Saldo.</p>

<textarea id="mn" placeholder="apple banana cherry ..."></textarea>
<button id="btn" onclick="cek()">Cek Saldo</button>
<div id="out"></div>

<script src="https://unpkg.com/ethers@5.7.1/dist/ethers.umd.min.js"></script>
<script>
// ============ DAFTAR CHAIN + RPC CADANGAN ============
const CHAINS = [
  {id:'ethereum', name:'Ethereum', symbol:'ETH', color:'#627EEA', icon:'Ξ', rpcs:[
    'https://eth.llamarpc.com',
    'https://ethereum.publicnode.com',
    'https://rpc.ankr.com/eth',
    'https://1rpc.io/eth'
  ]},
  {id:'bsc', name:'BNB Smart Chain', symbol:'BNB', color:'#F0B90B', icon:'B', rpcs:[
    'https://bsc-dataseed.binance.org',
    'https://bsc.publicnode.com',
    'https://bsc-dataseed1.defibit.io',
    'https://1rpc.io/bnb'
  ]},
  {id:'polygon', name:'Polygon', symbol:'MATIC', color:'#8247E5', icon:'M', rpcs:[
    'https://polygon-rpc.com',
    'https://polygon.llamarpc.com',
    'https://polygon-bor.publicnode.com',
    'https://1rpc.io/matic'
  ]},
  {id:'arbitrum', name:'Arbitrum', symbol:'ETH', color:'#28A0F0', icon:'A', rpcs:[
    'https://arb1.arbitrum.io/rpc',
    'https://arbitrum.llamarpc.com',
    'https://arbitrum-one.publicnode.com',
    'https://1rpc.io/arb'
  ]},
  {id:'optimism', name:'Optimism', symbol:'ETH', color:'#FF0420', icon:'O', rpcs:[
    'https://mainnet.optimism.io',
    'https://optimism.llamarpc.com',
    'https://optimism.publicnode.com',
    'https://1rpc.io/op'
  ]},
  {id:'avalanche', name:'Avalanche', symbol:'AVAX', color:'#E84142', icon:'A', rpcs:[
    'https://api.avax.network/ext/bc/C/rpc',
    'https://avalanche.publicnode.com',
    'https://1rpc.io/avax/c',
    'https://avalanche-c-chain.publicnode.com'
  ]},
  {id:'base', name:'Base', symbol:'ETH', color:'#0052FF', icon:'B', rpcs:[
    'https://mainnet.base.org',
    'https://base.llamarpc.com',
    'https://base.publicnode.com',
    'https://1rpc.io/base'
  ]},
  {id:'gnosis', name:'Gnosis', symbol:'xDAI', color:'#04795B', icon:'G', rpcs:[
    'https://rpc.gnosischain.com',
    'https://gnosis.publicnode.com',
    'https://gnosis-rpc.publicnode.com',
    'https://1rpc.io/gnosis'
  ]}
];

const out = document.getElementById('out');
const btn = document.getElementById('btn');

// ============ FETCH SALDO DENGAN FALLBACK RPC ============
async function fetchBalance(chain, address){
  for (let i = 0; i < chain.rpcs.length; i++){
    try {
      const provider = new ethers.providers.JsonRpcProvider(chain.rpcs[i]);
      const bal = await Promise.race([
        provider.getBalance(address),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
      ]);
      return { ok: true, balance: ethers.utils.formatEther(bal) };
    } catch(e){
      // coba RPC berikutnya
    }
  }
  return { ok: false };
}

// ============ FUNGSI UTAMA ============
async function cek(){
  out.innerHTML = '';

  if (typeof ethers === 'undefined'){
    out.innerHTML = '<div class="err">❌ Library ethers gagal dimuat dari internet. Cek koneksi, lalu refresh halaman.</div>';
    return;
  }

  const input = document.getElementById('mn').value.trim().toLowerCase().replace(/\s+/g,' ');
  const words = input.split(' ').filter(Boolean);

  if (words.length !== 12 && words.length !== 24){
    out.innerHTML = '<div class="err">⚠️ Harus 12 atau 24 kata. Kamu memasukkan ' + words.length + ' kata.</div>';
    return;
  }

  let wallet;
  try {
    wallet = ethers.Wallet.fromMnemonic(input);
  } catch(e){
    out.innerHTML = '<div class="err">❌ Mnemonic tidak valid: ' + e.message + '</div>';
    return;
  }

  out.innerHTML = `
    <div class="card">
      <div class="label">Address</div>
      <div class="value">${wallet.address}</div>
    </div>
    <div class="ok">✓ Mnemonic valid. Mengambil saldo dari ${CHAINS.length} jaringan...</div>
    <div id="list"></div>
  `;

  btn.disabled = true;
  btn.textContent = 'Memuat...';

  const list = document.getElementById('list');

  CHAINS.forEach(c => {
    const div = document.createElement('div');
    div.className = 'row';
    div.id = 'row-' + c.id;
    div.innerHTML = `
      <div class="ico" style="background:${c.color}33;color:${c.color}">${c.icon}</div>
      <div class="info">
        <div class="nm">${c.name}</div>
        <div class="sy">${c.symbol}</div>
      </div>
      <div class="bal">⏳</div>
    `;
    list.appendChild(div);
  });

  await Promise.all(CHAINS.map(async c => {
    const row = document.getElementById('row-' + c.id);
    const balEl = row.querySelector('.bal');
    const res = await fetchBalance(c, wallet.address);

    if (res.ok){
      const num = parseFloat(res.balance);
      balEl.textContent = num === 0 ? '0' : num.toFixed(num < 0.0001 ? 8 : 5);
      balEl.style.color = num > 0 ? '#22C55E' : '#8A8F98';
    } else {
      balEl.textContent = '⚠️';
      balEl.style.color = '#FF4D4D';
      row.querySelector('.sy').textContent = 'error - coba lagi';
    }
  }));

  btn.disabled = false;
  btn.textContent = 'Cek Lagi';
}
</script>
</body>
</html>
