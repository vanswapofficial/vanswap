  <style>
    :root{
      --primary: #1a7f5e;
      --primary-dark: #146c4d;
      --accent: #31d0aa;
      --text: #ffffff;
      --muted: rgba(255,255,255,0.12);
      --card-bg: rgba(14,42,33,0.85);
      --card-border: rgba(26,127,94,0.12);
      --glass: rgba(255,255,255,0.03);
      --warning: #ff9800;
      --danger: #f44336;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Kanit',sans-serif;
      background:linear-gradient(180deg,#04140d 0%, #07261b 100%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }
    .header{background: linear-gradient(135deg,var(--primary-dark),#0f593c);padding:12px 0;position:sticky;top:0;z-index:1300;border-bottom:1px solid rgba(0,0,0,0.25);}
    .nav-container{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;}
    .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
    .logo img{width:40px;height:40px;border-radius:8px;object-fit:cover}
    .logo span{font-weight:700;font-size:18px}
    .connect-wallet{background:var(--accent);color:#052017;border:none;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer;z-index:1400;position:relative}
    .menu-dot-btn{width:40px;height:40px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:18px;position:relative;z-index:1400;}
    .menu-dropdown{position:absolute;right:20px;top:64px;min-width:180px;background:rgba(255,255,255,0.03);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.04);border-radius:12px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,0.5);opacity:0;transform:translateY(-6px);pointer-events:none;transition:all .18s ease;z-index:1600;}
    .menu-dropdown.show{opacity:1;transform:translateY(0);pointer-events:auto}
    .menu-item{padding:10px;border-radius:10px;color:var(--text);cursor:pointer;font-weight:600}
    .menu-item:hover{background:rgba(255,255,255,0.02)}
    .menu-sep{height:1px;background:rgba(255,255,255,0.03);margin:6px 0;border-radius:2px}
    .main{max-width:1200px;margin:32px auto;padding:0 20px}
    .swap-row{display:flex;gap:24px;align-items:flex-start}
    @media (max-width:980px){.swap-row{flex-direction:column;padding-bottom:40px}}
    .card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:18px;flex:1;max-width:540px;box-shadow:0 10px 30px rgba(0,0,0,0.55)}
    .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .title{font-size:20px;font-weight:700}
    .settings-btn{background:transparent;border:1px solid rgba(255,255,255,0.03);padding:8px;border-radius:10px;cursor:pointer;z-index:1400;position:relative}
    .token-block{background:rgba(255,255,255,0.02);border-radius:12px;padding:10px;margin-bottom:12px;border:1px solid transparent}
    .token-block:focus-within{border-color:var(--primary)}
    .input-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .label{color:#cfece0;font-size:13px}
    .balance{color:var(--muted);font-size:13px;cursor:pointer}
    .row{display:flex;gap:12px;align-items:center}
    .select-wrap{position:relative;min-width:140px}
    .select{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:rgba(0,0,0,0.12);cursor:pointer;border:1px solid rgba(255,255,255,0.02);min-width:120px;z-index:1500}

    .symbol{font-weight:700}
    .amount-wrap{flex:1;display:flex;flex-direction:column;align-items:flex-end;min-width:0}
    .amount{width:100%;background:transparent;border:none;color:var(--text);font-size:22px;font-weight:700;text-align:right;padding:6px 0;outline:none}
    .amount::placeholder{color:var(--muted)}
    .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin-top:8px}

    .token-list{position:absolute;top:calc(100% + 8px);left:0;background:rgba(255,255,255,0.03);backdrop-filter:blur(6px);border-radius:12px;padding:8px;border:1px solid rgba(255,255,255,0.04);min-width:320px;max-height:320px;overflow:auto;z-index:2200;box-shadow:0 12px 32px rgba(0,0,0,0.5);pointer-events:auto}

    .token-option{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
    .token-option:hover{background:rgba(255,255,255,0.02)}
    .token-addr{font-size:12px;color:var(--muted)}
    .controls{text-align:center;margin:8px 0}
    .flip{background:var(--primary-dark);border:none;color:white;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px}
    .price{background:rgba(255,255,255,0.02);padding:10px;border-radius:10px;margin-top:12px}
    .info{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:6px 0}
    .primary{width:100%;background:var(--primary);border:none;padding:12px;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;margin-top:12px}
    .primary:disabled{opacity:0.5;cursor:not-allowed}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.12);border-top-color:var(--text);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .panel{flex:1;min-width:260px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:16px}
    .panel h4{font-weight:700;margin-bottom:10px}
    .panel-row{display:flex;justify-content:space-between;color:var(--muted);padding:8px 0}
    footer{margin-top:28px;text-align:center;padding:20px;color:var(--muted);font-size:13px}
    
    /* New styles for custom token feature */
    .add-token-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px dashed rgba(255,255,255,0.1);cursor:pointer;margin-top:8px;transition:all 0.2s ease}
    .add-token-btn:hover{background:rgba(255,255,255,0.04);border-color:var(--primary)}
    .add-token-btn span{font-weight:600;font-size:14px}
    .add-token-form{background:rgba(255,255,255,0.02);border-radius:12px;padding:16px;margin-top:12px;border:1px solid rgba(255,255,255,0.05)}
    .form-group{margin-bottom:12px}
    .form-label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
    .form-input{width:100%;padding:10px;border-radius:8px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.05);color:var(--text);font-size:14px}
    .form-input:focus{outline:none;border-color:var(--primary)}
    .form-actions{display:flex;gap:8px;margin-top:16px}
    .btn{flex:1;padding:10px;border-radius:8px;font-weight:600;cursor:pointer;border:none;font-size:14px}
    .btn-primary{background:var(--primary);color:white}
    .btn-secondary{background:rgba(255,255,255,0.05);color:var(--text)}
    .warning-box{background:rgba(255,152,0,0.1);border:1px solid rgba(255,152,0,0.3);border-radius:8px;padding:12px;margin-top:12px}
    .warning-header{display:flex;align-items:center;gap:8px;color:var(--warning);font-weight:600;margin-bottom:6px}
    .warning-text{color:var(--warning);font-size:13px;line-height:1.4}
    .token-verified{color:var(--accent);font-size:11px;margin-left:6px}
    .token-imported{color:var(--primary);font-size:11px;margin-left:6px}
    .token-warning{color:var(--warning);font-size:11px;margin-left:6px}
    
    @media (max-width:520px){.select img{width:28px;height:28px}.amount{font-size:20px}.menu-dropdown{right:12px;left:auto}.token-list{min-width:260px;left:0;right:0}}
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="nav-container">

  <!-- MAIN -->
  <main class="main">
    <div class="swap-row">

        </div>

        <!-- FROM -->

            <div class="label">From</div>
            <div id="fromBalance" class="balance">—</div>
          </div>
          <div class="row">
            <div class="select-wrap">
              <div id="fromSelect" class="select" tabindex="0" aria-haspopup="listbox" aria-expanded="false">
                <img id="fromLogo" src="https://vanswap.xyz/assets/vana.png" alt="">
                <div style="min-width:0">
                  <div id="fromSymbol" class="symbol">VANA</div>
                </div>
                <div style="margin-left:auto;color:var(--muted)">▼</div>
              </div>

              <div id="fromList" class="token-list" style="display:none"></div>
            </div>

            <div class="amount-wrap">
              <input id="fromAmount" class="amount" placeholder="0.0" inputmode="decimal" autocomplete="off">
              <div class="meta">
                <div id="fromUsd" class="usd">—</div>
                <button id="btnMax" class="max" disabled>MAX</button>
              </div>
            </div>
          </div>
        </div>

        <!-- flip -->
        <div class="controls">
          <button id="flip" class="flip" title="Switch tokens">↕</button>
        </div>

        <!-- TO -->
        <div class="token-block" id="toBlock">
          <div class="input-head">
            <div class="label">To</div>
            <div id="toBalance" class="balance">—</div>
          </div>
          <div class="row">
            <div class="select-wrap">
              <div id="toSelect" class="select" tabindex="0" aria-haspopup="listbox" aria-expanded="false">
                <img id="toLogo" src="https://vanswap.xyz/assets/wvana.png" alt="">
                <div style="min-width:0">
                  <div id="toSymbol" class="symbol">WVANA</div>
                </div>
                <div style="margin-left:auto;color:var(--muted)">▼</div>
              </div>

              <div id="toList" class="token-list" style="display:none"></div>
            </div>

            <div class="amount-wrap">
              <div id="toAmount" class="amount" style="color:var(--muted)">—</div>
              <div class="meta">
                <div id="toUsd" class="usd">—</div>
                <button class="max" style="visibility:hidden">MAX</button>
              </div>
            </div>
          </div>
        </div>

        <!-- price info -->
        <div class="price" aria-live="polite">
          <div class="info"><div>Price</div><div id="price">—</div></div>
          <div class="info"><div>Price impact</div><div id="impact">—</div></div>
          <div class="info"><div>Minimum received</div><div id="minRec">—</div></div>
        </div>

        <!-- action -->
        <button id="actionBtn" class="primary">Connect Wallet</button>

        <div style="margin-top:12px;color:var(--muted);font-size:13px;text-align:center">
          <div id="status">Ready</div>
          <div id="txLink" style="margin-top:6px;font-size:12px;word-break:break-all"></div>
        </div>
      </section>

      <!-- PANEL -->
      <aside class="panel" aria-label="Info">
        <h4>Trade Information</h4>
        <div class="panel-row"><div>Minimum received</div><div id="panelMin">—</div></div>
        <div class="panel-row"><div>Price impact</div><div id="panelImpact">—</div></div>
        <div class="panel-row"><div>Fee</div><div>0.25%</div></div>
        <div class="panel-row"><div>Route</div><div id="panelRoute">—</div></div>

        <h4 style="margin-top:14px">VanSwap Info</h4>
        <div class="panel-row"><div>Total Liquidity</div><div id="vs_total">$—</div></div>
        <div class="panel-row"><div>VANS Price</div><div id="vs_vansprice">$—</div></div>
        <div class="panel-row"><div>24h Volume</div><div id="vs_vol">$—</div></div>
      </aside>
    </div>
  </main>

  <!-- SETTINGS POPUP -->
  <div id="settingsPopup" style="position:fixed;right:20px;top:80px;z-index:1700;display:none;min-width:220px;background:rgba(255,255,255,0.03);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.04);padding:12px;border-radius:10px;pointer-events:auto;">
    <label style="color:var(--muted);font-size:13px">Slippage tolerance (%)</label>
    <input id="slippage" type="number" step="0.1" min="0.1" style="width:100%;padding:8px;margin-top:6px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.03);color:var(--text)" />

    <input id="deadline" type="number" min="1" style="width:100%;padding:8px;margin-top:6px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.03);color:var(--text)" />
    <div style="display:flex;gap:8px;margin-top:10px">
      <button id="saveSettings" style="flex:1;padding:8px;border-radius:8px;background:var(--primary);border:none;font-weight:700;cursor:pointer">Save</button>
      <button id="closeSettings" style="padding:8px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.04);cursor:pointer">Close</button>
    </div>
  </div>

  <footer>© 2025 VanSwap. Built on Vana Chain</footer>

    const ROUTER_ABI = [
      'function getAmountsOut(uint amountIn, address[] memory path) public view returns (uint[] memory amounts)',
      'function swapExactTokensForTokens(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) external returns (uint[] memory amounts)',
      'function swapExactETHForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) external payable returns (uint[] memory amounts)',
      'function swapExactTokensForETH(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) external returns (uint[] memory amounts)'
    ];
    const FACTORY_ABI = ['function getPair(address tokenA, address tokenB) external view returns (address pair)'];
    const PAIR_ABI = ['function getReserves() view returns (uint112,uint112,uint32)','function token0() view returns (address)','function token1() view returns (address)'];

    const ERC20_ABI = [
      'function balanceOf(address account) external view returns (uint256)',

    const DEFAULT_TOKENS = [

      { symbol: 'VANS', address: VANS, logo: 'https://vanswap.xyz/assets/vans.png', decimals: 18, verified: true}
    ];

    let tokens = DEFAULT_TOKENS.slice();
    let selectedFrom = tokens[0];
    let selectedTo = tokens[1];

    const $ = id => document.getElementById(id);
    function showToast(msg, t = 2400){
      const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
      el.style.position = 'fixed'; el.style.bottom = '20px'; el.style.left = '50%'; el.style.transform = 'translateX(-50%)';
      el.style.background = 'var(--primary)'; el.style.color = 'white'; el.style.padding = '12px 20px';
      el.style.borderRadius = '8px'; el.style.zIndex = '9999'; el.style.fontWeight = '600';
      el.style.opacity = '0'; el.style.transition = 'opacity .18s';
      document.body.appendChild(el);
      setTimeout(()=> el.style.opacity = '1', 10);
      setTimeout(()=> { el.style.opacity = '0'; setTimeout(()=> el.remove(), 300); }, t);
    }
    function setStatus(s){ $('status').textContent = s }

    // MENU
    const menuBtn = $('menuBtn');
    const menuDropdown = $('menuDropdown');
    menuBtn.addEventListener('click', (e)=>{ e.stopPropagation(); menuDropdown.classList.toggle('show'); });
    menuDropdown.querySelectorAll('.menu-item').forEach(it=>{ it.addEventListener('click', ()=> { const href = it.getAttribute('data-href'); window.location.href = href; }); });
    document.addEventListener('click', ()=> menuDropdown.classList.remove('show'));

    // SETTINGS
    const settingsBtn = $('settingsBtn');
    const settingsPopup = $('settingsPopup');
    const slippageInput = $('slippage');
    const deadlineInput = $('deadline');
    const saveSettings = $('saveSettings');
    const closeSettings = $('closeSettings');

    const store = { slippage: parseFloat(localStorage.getItem('vanswap_slippage') || '0.5'), deadline: parseInt(localStorage.getItem('vanswap_deadline') || '10') };

    // Function to import custom token
    async function importCustomToken(type, address) {
      if (!address || address.trim() === '') {
        showToast('Please enter a token address');
        return;
      }
      
      // Basic validation
      if (!/^0x[a-fA-F0-9]{40}$/.test(address.trim())) {
        showToast('Invalid token address format');
        return;
      }
      
      // Check if token already exists
      const existingToken = tokens.find(t => 
        t.address.toLowerCase() === address.trim().toLowerCase()
      );
      
      if (existingToken) {
        showToast('Token already in list');
        selectToken(type, existingToken);
        return;
      }
      
      try {
        setStatus('Importing token...');
        
        if (!provider) {
          provider = new ethers.providers.JsonRpcProvider(RPC);
        }
        
        const tokenContract = new ethers.Contract(address, ERC20_ABI, provider);
        
        // Get token details
        const [symbol, decimals] = await Promise.all([
          tokenContract.symbol(),
          tokenContract.decimals()
        ]);
        
        // Create token object
        const newToken = {
          symbol: symbol,
          address: address,
          decimals: decimals,
          logo: 'https://vanswap.xyz/assets/unknown.png', // Default logo
          custom: true,
          verified: false
        };
        
        // Add to tokens list
        tokens.push(newToken);
        
        // Save to localStorage
        saveCustomTokens();
        
        // Select the token
        selectToken(type, newToken);
        
        // Rebuild token list to show new token
        buildTokenListHtml(type);
        
        showToast(`Token ${symbol} imported successfully`);
        setStatus('Token imported');
        
      } catch (error) {
        console.error('Error importing token:', error);
        showToast('Failed to import token. Check the address and try again.');
        setStatus('Import failed');
      }
    }
    
    // Save custom tokens to localStorage
    function saveCustomTokens() {
      const customTokens = tokens.filter(t => t.custom);
      localStorage.setItem('vanswap_custom_tokens', JSON.stringify(customTokens));
    }
    
    // Load custom tokens from localStorage
    function loadCustomTokens() {
      try {
        const stored = localStorage.getItem('vanswap_custom_tokens');
        if (stored) {
          const customTokens = JSON.parse(stored);
          // Filter out any duplicates
          customTokens.forEach(ct => {
            if (!tokens.some(t => t.address.toLowerCase() === ct.address.toLowerCase())) {
              tokens.push(ct);
            }
          });
        }
      } catch (error) {
        console.error('Error loading custom tokens:', error);
      }
    }

    async function compute(){
      const val = $('fromAmount').value;
      if(!val || isNaN(Number(val)) || Number(val) <= 0){ $('toAmount').textContent = '—'; $('price').textContent = '—'; $('fromUsd').textContent = '—'; $('toUsd').textContent = '—'; $('minRec').textContent = '—'; $('panelMin').textContent = '—'; $('panelImpact').textContent = '—'; $('panelRoute').textContent = '—'; return; }
      try{
        if(!router){ provider = provider || new ethers.providers.JsonRpcProvider(RPC); router = router || new ethers.Contract(ROUTER, ROUTER_ABI, provider); }
        const fromAddr = selectedFrom.address === 'VANA_NATIVE' ? WVANA : selectedFrom.address;
        const toAddr = selectedTo.address === 'VANA_NATIVE' ? WVANA : selectedTo.address;
        const path = [fromAddr, toAddr];
        const decFrom = selectedFrom.decimals || 18;
        const decTo = selectedTo.decimals || 18;
        const amountInWei = ethers.utils.parseUnits(String(val), decFrom);
        const amounts = await router.getAmountsOut(amountInWei, path);
        const amountOut = amounts[1];
        const outStr = ethers.utils.formatUnits(amountOut, decTo);
        $('toAmount').textContent = parseFloat(outStr).toFixed(6);
        const price = parseFloat(outStr) / parseFloat(val);
        $('price').textContent = `1 ${selectedFrom.symbol} = ${price.toFixed(6)} ${selectedTo.symbol}`;
        const s = parseFloat(localStorage.getItem('vanswap_slippage') || slippageInput.value || 0.5);
        const sBps = Math.round(s * 100);
        const amountOutMin = amountOut.mul(10000 - sBps).div(10000);
        const amountOutMinFmt = ethers.utils.formatUnits(amountOutMin, decTo);
        $('minRec').textContent = `${parseFloat(amountOutMinFmt).toFixed(6)} ${selectedTo.symbol}`;
        $('panelMin').textContent = $('minRec').textContent;
        if(selectedFrom.symbol === 'USDC'){ $('fromUsd').textContent = `≈ $${Number(val).toFixed(2)}` } else { $('fromUsd').textContent = '—' }
        if(selectedTo.symbol === 'USDC'){ $('toUsd').textContent = `≈ $${parseFloat($('toAmount').textContent||0).toFixed(2)}` } else { $('toUsd').textContent = '—' }
        $('panelRoute').textContent = `${selectedFrom.symbol} → ${selectedTo.symbol}`;
        $('panelImpact').textContent = '—'; $('impact').textContent = '—';
      }catch(e){ console.error('compute', e); $('toAmount').textContent = '—'; $('price').textContent = '—'; }

    async function executeSwap(){ if(!account || !signer){ await connectWallet(); return; } const val = $('fromAmount').value; if(!val || isNaN(Number(val)) || Number(val) <= 0){ showToast('Enter amount'); return; } try{ setStatus('Preparing...'); const btn = $('actionBtn'); btn.disabled = true; btn.innerHTML = '<span class=\"spinner\"></span>Processing...'; const decFrom = selectedFrom.decimals || 18; const decTo = selectedTo.decimals || 18; const amountInWei = ethers.utils.parseUnits(String(val), decFrom); const fromAddr = selectedFrom.address; if(fromAddr !== 'VANA_NATIVE'){ const tokenC = new ethers.Contract(fromAddr, ERC20_ABI, signer); const allowance = await tokenC.allowance(account, ROUTER); if(allowance.lt(amountInWei)){ setStatus('Approving token...'); const txA = await tokenC.approve(ROUTER, ethers.constants.MaxUint256); await txA.wait(); } } const fromAddrForPath = selectedFrom.address === 'VANA_NATIVE' ? WVANA : selectedFrom.address; const toAddrForPath = selectedTo.address === 'VANA_NATIVE' ? WVANA : selectedTo.address; const path = [fromAddrForPath, toAddrForPath]; const amounts = await router.getAmountsOut(amountInWei, path); const amountOut = amounts[1]; const s = parseFloat(localStorage.getItem('vanswap_slippage') || slippageInput.value || 0.5); const sBps = Math.round(s * 100); const amountOutMin = amountOut.mul(10000 - sBps).div(10000); const deadlineMin = parseInt(localStorage.getItem('vanswap_deadline') || deadlineInput.value || 10); const deadline = Math.floor(Date.now() / 1000) + 60 * deadlineMin; let tx; if(fromAddr === 'VANA_NATIVE'){ tx = await router.swapExactETHForTokens(amountOutMin, path, account, deadline, { value: amountInWei, gasLimit: 400000 }); } else if(selectedTo.address === 'VANA_NATIVE'){ tx = await router.swapExactTokensForETH(amountInWei, amountOutMin, path, account, deadline, { gasLimit: 500000 }); } else { tx = await router.swapExactTokensForTokens(amountInWei, amountOutMin, path, account, deadline, { gasLimit: 500000 }); } $('txLink').innerHTML = `<a href=\"https://vanascan.to/tx/${tx.hash}\" target=\"_blank\" style=\"color:var(--accent)\">View on Explorer</a>`; setStatus('Submitted — waiting confirmation...'); await tx.wait(); setStatus('Swap confirmed'); showToast('Swap successful'); await updateBalances(); await updateDropdownBalances(); compute(); }catch(e){ console.error('swap', e); showToast('Swap failed: ' + (e.message || e)); setStatus('Swap failed'); }finally{ const btn = $('actionBtn'); btn.disabled = false; updateActionBtn(); } }

    // FETCH VanSwap info via factory/pair (best-effort)
    async function fetchVanSwapInfo(){ try{ if(!provider) provider = new ethers.providers.JsonRpcProvider(RPC); factory = factory || new ethers.Contract(FACTORY, FACTORY_ABI, provider); const pair = await factory.getPair(VANS, USDC); if(!pair || pair === '0x0000000000000000000000000000000000000000'){ $('vs_total').textContent = '$—'; $('vs_vansprice').textContent = '$—'; $('vs_vol').textContent = '$—'; return; } const pairC = new ethers.Contract(pair, PAIR_ABI, provider); const [r0, r1] = await pairC.getReserves(); const t0 = await pairC.token0(); const t1 = await pairC.token1(); // determine which reserve is USDC (6 decimals)
        // normalize reserves
        let reserveUSDC = null; let reserveVANS = null;
        if(t0.toLowerCase() === USDC.toLowerCase()){ reserveUSDC = Number(ethers.utils.formatUnits(r0,6)); reserveVANS = Number(ethers.utils.formatUnits(r1,18)); }
        else if(t1.toLowerCase() === USDC.toLowerCase()){ reserveUSDC = Number(ethers.utils.formatUnits(r1,6)); reserveVANS = Number(ethers.utils.formatUnits(r0,18)); }
        if(reserveUSDC && reserveVANS){ const vansPrice = reserveUSDC / (reserveVANS || 1); const totalLiquidity = reserveUSDC + (reserveVANS * vansPrice); $('vs_vansprice').textContent = `$${vansPrice.toFixed(6)}`; $('vs_total').textContent = `$${(totalLiquidity).toFixed(2)}`; } else { $('vs_total').textContent = '$—'; $('vs_vansprice').textContent = '$—'; }
    }catch(e){ console.error('fetchVanSwapInfo', e); $('vs_total').textContent = '$—'; $('vs_vansprice').textContent = '$—'; $('vs_vol').textContent = '$—'; } }

    function debounce(fn, t=300){ let timer; return (...args)=>{ clearTimeout(timer); timer = setTimeout(()=> fn(...args), t); }; }
    slippageInput.addEventListener('change', ()=> localStorage.setItem('vanswap_slippage', slippageInput.value));
