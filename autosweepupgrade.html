<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Transfer ETH — Fast</title>
<style>
  body { font-family: monospace; max-width: 820px; margin: 20px auto; padding: 0 14px; background:#111; color:#eee; }
  h2 { color:#4fc3f7; margin: 10px 0; }
  input, button, select, textarea { font-family: monospace; font-size: 14px; padding: 8px; background:#222; color:#eee; border:1px solid #444; border-radius:4px; }
  input, select, textarea { width: 100%; box-sizing: border-box; margin-bottom: 10px; }
  textarea { min-height: 78px; resize: vertical; }
  button { background:#4fc3f7; color:#000; font-weight:bold; cursor:pointer; border:none; padding:10px 20px; }
  button:disabled { background:#555; cursor:not-allowed; opacity:.6; }
  button.big { font-size:16px; padding:14px 20px; width:100%; margin-top:6px; }
  button.go { background:#81c784; }
  button.stop { background:#ef5350; color:#fff; }
  button.cancel { background:#ffb74d; color:#000; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  pre { background:#000; padding:12px; border:1px solid #333; white-space:pre-wrap; word-break:break-all; max-height:360px; overflow:auto; }
  .warn { color:#ffb74d; } .err { color:#ef5350; } .ok { color:#81c784; } .info { color:#4fc3f7; } .dim { color:#666; }
  label { display:block; margin-top:12px; margin-bottom:4px; color:#aaa; font-size:12px; }
  .saldo { background:#0a2a0a; padding:10px; border:1px solid #2a5a2a; border-radius:4px; margin:10px 0; font-size:13px; line-height:1.6; }
  .saldo.wallet-card { background:#0a1a2a; border-color:#2a4a6a; margin:6px 0; padding:8px 10px; }
  .chk { display:flex; align-items:center; gap:8px; margin:10px 0; font-size:12px; color:#aaa; }
  .chk input { width:auto; margin:0; }
  .status { text-align:center; font-size:18px; font-weight:bold; color:#ffb74d; margin:10px 0; min-height:26px; }
  .status.active { color:#81c784; }
  .pulse { animation: p 1s infinite; }
  @keyframes p { 0%,100%{opacity:1} 50%{opacity:.4} }
  .small { font-size:11px; color:#888; }
</style>
</head>
<body>
<h2>Auto Transfer ETH — Fast</h2>

<label>Private key (satu per baris)</label>
<textarea id="pk" placeholder="0xabc...&#10;0xdef..."></textarea>

<label>Alamat tujuan</label>
<input id="to" placeholder="0x...">

<label>Network</label>
<select id="net">
  <option value="eth">Ethereum Mainnet</option>
  <option value="sep">Sepolia Testnet</option>
  <option value="poa">POA Core (chain 99)</option>
</select>

<label>Interval cek (ms) — min 50</label>
<input id="interval" type="number" min="50" step="10" value="100">

<div class="grid3">
  <div>
    <label>Max Fee Multiplier (×base)</label>
    <input id="maxMult" type="number" min="1" step="0.5" value="3">
  </div>
  <div>
    <label>Priority (gwei)</label>
    <input id="prioGwei" type="number" min="0.1" step="0.1" value="5">
  </div>
  <div>
    <label>Min Max-Fee (gwei)</label>
    <input id="minMaxGwei" type="number" min="1" step="1" value="40">
  </div>
</div>

<label>Mode deteksi</label>
<select id="mode">
  <option value="ws">WebSocket (instan, butuh RPC WSS)</option>
  <option value="poll" selected>Polling (default)</option>
</select>

<div class="saldo" id="saldoBox">Saldo: —</div>

<div class="chk">
  <input type="checkbox" id="autoConfirm" checked>
  <label for="autoConfirm" style="margin:0;">Kirim tanpa konfirmasi</label>
</div>
<div class="chk">
  <input type="checkbox" id="cancelOnStop">
  <label for="cancelOnStop" style="margin:0;">Saat STOP: batalkan pending tx</label>
</div>
<div class="chk">
  <input type="checkbox" id="legacyGas">
  <label for="legacyGas" style="margin:0;">Pakai legacy gasPrice (untuk POA / chain lama)</label>
</div>

<div class="status" id="status">— idle —</div>

<div class="grid2">
  <button class="big go" id="btnStart" onclick="startAuto()">▶ START</button>
  <button class="big stop" id="btnStop" onclick="stopAuto()" disabled>■ STOP</button>
</div>
<button class="big" id="btnOnce" onclick="goOnce()" style="background:#4fc3f7; margin-top:8px;">↻ Kirim Sekali (semua PK)</button>
<button class="big cancel" id="btnCancel" onclick="cancelPending()" style="margin-top:8px;">✖ Batalkan Semua Pending Tx</button>

<pre id="log">Siap. Isi PK & tujuan, klik START.</pre>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<script>
/* =========================================================
   KONFIGURASI NETWORK
   ========================================================= */
const NETWORKS = {
  eth: {
    name:"Ethereum", chainId:1n, symbol:"ETH", explorer:"https://etherscan.io/tx/",
    rpcs:["https://ethereum-rpc.publicnode.com","https://eth.llamarpc.com","https://rpc.flashbots.net","https://eth.drpc.org"],
    wss:["wss://ethereum-rpc.publicnode.com"]
  },
  sep: {
    name:"Sepolia", chainId:11155111n, symbol:"ETH", explorer:"https://sepolia.etherscan.io/tx/",
    rpcs:["https://ethereum-sepolia-rpc.publicnode.com","https://rpc.sepolia.org","https://sepolia.drpc.org"],
    wss:["wss://ethereum-sepolia-rpc.publicnode.com"]
  },
  poa: {
    name:"POA", chainId:99n, symbol:"POA", explorer:"https://explorer.poa.network/tx/",
    rpcs:["https://rpc.poa.network","https://core.poa.network"],
    wss:[]
  }
};
const GAS_LIMIT = 21000n;

/* =========================================================
   STATE
   ========================================================= */
let provider = null;
let wsProvider = null;
let wallets = [];
let autoRunning = false;
let loopId = null;
let loopBusy = false;
let lastStatusKey = "";
let lastUiRefresh = 0;
let pksCache = "";

// pending & nonce
const pendingTx = new Map();     // addr -> { nonce, hash, maxFee, prio, legacy, ts }
const localNonce = new Map();    // addr -> next nonce (diincrement lokal)

// cache gas (biar tidak spam RPC)
let gasCache = { data:null, ts:0 };
const GAS_TTL = 3000;            // refresh feeData tiap 3 detik
let lastBlock = 0n;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* =========================================================
   UTIL
   ========================================================= */
function log(msg, cls) {
  const t = new Date().toLocaleTimeString();
  const el = $('log');
  el.innerHTML += `<span class="dim">[${t}]</span> ` + (cls ? `<span class="${cls}">${msg}</span>` : msg) + "\n";
  el.scrollTop = el.scrollHeight;
}
function reset() { $('log').textContent = ""; lastStatusKey = ""; }
function cfg() { return NETWORKS[$('net').value]; }
function setStatus(text, active) {
  const el = $('status');
  el.textContent = text;
  el.classList.toggle('active', !!active);
  el.classList.toggle('pulse', !!active);
}
function getInterval() {
  const v = parseInt($('interval').value, 10);
  return isNaN(v) ? 100 : Math.max(50, v);
}
function getGasCfg() {
  return {
    maxMult: Math.max(1, parseFloat($('maxMult').value) || 3),
    prioGwei: Math.max(0.1, parseFloat($('prioGwei').value) || 5),
    minMaxGwei: Math.max(1, parseFloat($('minMaxGwei').value) || 40),
    legacy: $('legacyGas').checked
  };
}

/* =========================================================
   AUTO-SAVE
   ========================================================= */
['pk','to','net','interval','maxMult','prioGwei','minMaxGwei','mode'].forEach(id => {
  const saved = localStorage.getItem('atx_' + id);
  if (saved) $(id).value = saved;
  $(id).addEventListener('input', () => localStorage.setItem('atx_' + id, $(id).value));
  $(id).addEventListener('change', () => localStorage.setItem('atx_' + id, $(id).value));
});
['autoConfirm','cancelOnStop','legacyGas'].forEach(id => {
  const saved = localStorage.getItem('atx_' + id);
  if (saved !== null) $(id).checked = saved === 'true';
  $(id).addEventListener('change', () => localStorage.setItem('atx_' + id, $(id).checked));
});

/* =========================================================
   RPC
   ========================================================= */
async function probeRpc(url, chainId) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 4000);
  try {
    const res = await fetch(url, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ jsonrpc:"2.0", method:"eth_chainId", params:[], id:1 }),
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    if (!j.result || BigInt(parseInt(j.result, 16)) !== chainId) throw new Error("chain mismatch");
  } finally { clearTimeout(t); }
}
async function pilihProvider(net) {
  let lastErr;
  for (const url of net.rpcs) {
    try {
      await probeRpc(url, net.chainId);
      const p = new ethers.JsonRpcProvider(url, net.chainId, { staticNetwork: true });
      log(`✓ RPC: ${url}`, "ok");
      return p;
    } catch (e) { lastErr = e; log(`✗ RPC ${url} → ${e.message}`, "dim"); }
  }
  throw new Error("Semua RPC " + net.name + " gagal: " + (lastErr?.message || "-"));
}
async function pilihWs(net) {
  if (!net.wss?.length) return null;
  for (const url of net.wss) {
    try {
      const p = new ethers.WebSocketProvider(url, net.chainId);
      // tes cepat
      await Promise.race([
        p.getBlockNumber(),
        new Promise((_,rej) => setTimeout(()=>rej(new Error("timeout")), 4000))
      ]);
      log(`✓ WSS: ${url}`, "ok");
      return p;
    } catch (e) { log(`✗ WSS ${url} → ${e.message}`, "dim"); try { p?.destroy?.(); } catch{} }
  }
  return null;
}

/* =========================================================
   GAS — cached
   ========================================================= */
async function hitungGas(force=false) {
  const now = Date.now();
  if (!force && gasCache.data && now - gasCache.ts < GAS_TTL) return gasCache.data;

  const c = getGasCfg();
  const fee = await provider.getFeeData();

  const baseFee = fee.maxFeePerGas ?? fee.gasPrice ?? ethers.parseUnits("30","gwei");
  const prio    = ethers.parseUnits(String(c.prioGwei), "gwei");
  const minMax  = ethers.parseUnits(String(c.minMaxGwei), "gwei");

  let maxFee = (baseFee * BigInt(Math.floor(c.maxMult * 10))) / 10n + prio;
  if (maxFee < minMax) maxFee = minMax;

  let out;
  if (c.legacy || !fee.maxFeePerGas) {
    const gp = maxFee > (fee.gasPrice ?? 0n) ? maxFee : (fee.gasPrice ?? maxFee);
    out = { mode:"legacy", gasPrice: gp, maxFee: gp, prio: 0n, gasCost: GAS_LIMIT * gp };
  } else {
    out = { mode:"eip1559", maxFee, prio, gasPrice: maxFee, gasCost: GAS_LIMIT * maxFee };
  }
  gasCache = { data: out, ts: now };
  return out;
}

/* =========================================================
   WALLET
   ========================================================= */
function parsePKs() { return $('pk').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean); }

async function ensureConn() {
  const net = cfg();
  const pks = parsePKs();
  if (!pks.length) throw new Error("Private key kosong");

  if (!provider) provider = await pilihProvider(net);

  const sig = pks.join("|");
  if (sig !== pksCache) {
    const built = [];
    for (const pk of pks) {
      try {
        const w = new ethers.Wallet(pk);
        built.push({ pk, wallet: w, address: w.address });
      } catch (e) {
        throw new Error("PK tidak valid: " + pk.slice(0,10) + "... — " + e.message);
      }
    }
    wallets = built;
    pksCache = sig;
    // reset nonce lokal saat ganti set wallet
    localNonce.clear();
    pendingTx.clear();
  }
  for (const it of wallets) {
    if (it.wallet.provider !== provider) it.wallet = it.wallet.connect(provider);
  }
  return provider;
}

/* =========================================================
   NONCE — pakai lokal, refresh hanya saat perlu
   ========================================================= */
async function ambilNonce(addr) {
  // kalau sudah ada di lokal, pakai itu
  if (localNonce.has(addr)) {
    const n = localNonce.get(addr);
    localNonce.set(addr, n + 1);
    return n;
  }
  // kalau ada pending, pakai nonce pending + 1
  const p = pendingTx.get(addr);
  if (p) {
    const n = p.nonce + 1;
    localNonce.set(addr, n + 1);
    return n;
  }
  // fallback: tanya RPC sekali, lalu cache
  const onchain = await provider.getTransactionCount(addr, "pending");
  localNonce.set(addr, Number(onchain) + 1);
  return Number(onchain);
}

function sinkronNonce(addr, confirmedNonce) {
  const cur = localNonce.get(addr);
  if (cur === undefined || Number(confirmedNonce) >= cur) {
    localNonce.set(addr, Number(confirmedNonce));
  }
}

/* =========================================================
   KIRIM SATU — tanpa getTransactionCount per-kirim
   ========================================================= */
async function kirimSatu(item, to, net, gas) {
  const addr = item.address;

  // kalau ada pending, cek receipt dulu
  const cached = pendingTx.get(addr);
  if (cached) {
    if (!cached.hash) return false;
    const rc = await provider.getTransactionReceipt(cached.hash).catch(() => null);
    if (!rc) return false;            // masih pending → skip
    sinkronNonce(addr, rc.nonce + 1);
    pendingTx.delete(addr);
  }

  const bal = await provider.getBalance(addr);
  const value = bal - gas.gasCost;
  if (value <= 0n) return false;

  const nonce = await ambilNonce(addr);

  // lock SEBELUM kirim
  pendingTx.set(addr, { nonce, hash:null, maxFee:gas.maxFee, prio:gas.prio, legacy:gas.mode==="legacy", ts:Date.now() });

  try {
    let tx;
    if (gas.mode === "legacy") {
      tx = await item.wallet.sendTransaction({ to, value, gasLimit: GAS_LIMIT, gasPrice: gas.maxFee, nonce });
    } else {
      tx = await item.wallet.sendTransaction({
        to, value, gasLimit: GAS_LIMIT,
        maxFeePerGas: gas.maxFee, maxPriorityFeePerGas: gas.prio, type:2, nonce
      });
    }
    pendingTx.set(addr, { nonce, hash:tx.hash, maxFee:gas.maxFee, prio:gas.prio, legacy:gas.mode==="legacy", ts:Date.now() });
    log(`✓ [${addr.slice(0,8)}...] ${ethers.formatEther(value)} ${net.symbol} → ${tx.hash} (n=${nonce})`, "ok");

    tx.wait().then(r => {
      if (r) {
        sinkronNonce(addr, r.nonce + 1);
        log(`  ✓ confirm blok ${r.blockNumber} (${addr.slice(0,8)}...)`, "ok");
        pendingTx.delete(addr);
      }
    }).catch(err => {
      log(`  ⚠ wait error ${addr.slice(0,8)}...: ${err.shortMessage || err.message}`, "warn");
      // jangan hapus nonce lokal — biarkan naik
      pendingTx.delete(addr);
    });
    return true;
  } catch (e) {
    // kirim gagal → rollback nonce lokal
    const cur = localNonce.get(addr);
    if (cur !== undefined) localNonce.set(addr, Math.min(cur, nonce));
    pendingTx.delete(addr);
    log(`✗ [${addr.slice(0,8)}...] ${e.shortMessage || e.message}`, "err");
    return false;
  }
}

/* =========================================================
   KIRIM PARALEL
   ========================================================= */
async function kirimSemua(to, net) {
  const gas = await hitungGas();
  const results = await Promise.allSettled(wallets.map(w => kirimSatu(w, to, net, gas)));
  return results.some(r => r.status === "fulfilled" && r.value === true);
}

/* =========================================================
   GO ONCE
   ========================================================= */
async function goOnce() {
  const net = cfg();
  const to = $('to').value.trim();
  if (!ethers.isAddress(to)) return log("✗ Alamat tujuan tidak valid.", "err");
  try {
    await ensureConn();
    if (!$('autoConfirm').checked) {
      if (!confirm(`Kirim dari ${wallets.length} wallet ke ${to}?`)) return log("Dibatalkan.", "warn");
    }
    await kirimSemua(to, net);
    await refreshSaldo(true);
  } catch (e) {
    log("✗ Error: " + (e.shortMessage || e.message), "err");
  }
}

/* =========================================================
   CANCEL PENDING
   ========================================================= */
async function cancelPending() {
  try {
    await ensureConn();
    let any = false;
    for (const item of wallets) {
      const addr = item.address;
      let info = pendingTx.get(addr);
      if (!info || !info.hash) continue;
      any = true;

      const fee = await provider.getFeeData();
      const baseFee = fee.maxFeePerGas ?? fee.gasPrice ?? ethers.parseUnits("30","gwei");
      let cancelMax, cancelPrio;
      if (info.legacy) {
        const prev = info.maxFee ?? baseFee;
        cancelMax = (prev * 125n) / 100n + ethers.parseUnits("1","gwei");
        cancelPrio = 0n;
      } else {
        const prevMax  = info.maxFee ?? baseFee;
        const prevPrio = info.prio   ?? ethers.parseUnits("2","gwei");
        cancelMax  = (prevMax  * 125n) / 100n + ethers.parseUnits("1","gwei");
        cancelPrio = (prevPrio * 125n) / 100n + ethers.parseUnits("0.5","gwei");
      }

      log(`✖ [${addr.slice(0,8)}...] cancel nonce ${info.nonce}`, "warn");
      try {
        let tx;
        if (info.legacy) {
          tx = await item.wallet.sendTransaction({ to: addr, value:0n, gasLimit:GAS_LIMIT, gasPrice:cancelMax, nonce:info.nonce });
        } else {
          tx = await item.wallet.sendTransaction({
            to: addr, value:0n, gasLimit:GAS_LIMIT,
            maxFeePerGas:cancelMax, maxPriorityFeePerGas:cancelPrio, type:2, nonce:info.nonce
          });
        }
        log(`  ✓ cancel tx: ${tx.hash}`, "ok");
        pendingTx.delete(addr);
      } catch (e) {
        log(`  ✗ gagal cancel: ${e.shortMessage || e.message}`, "err");
      }
    }
    if (!any) log("Tidak ada pending tx untuk dibatalkan.", "warn");
  } catch (e) {
    log("✗ Error cancel: " + (e.shortMessage || e.message), "err");
  }
}

/* =========================================================
   LOOP — polling & event-driven
   ========================================================= */
async function loopTick() {
  if (!autoRunning || loopBusy) return;
  loopBusy = true;
  const net = cfg();
  try {
    await ensureConn();
    const to = $('to').value.trim();
    if (!ethers.isAddress(to)) throw new Error("Alamat tujuan tidak valid");

    const gas = await hitungGas();
    const bals = await Promise.all(wallets.map(w => provider.getBalance(w.address).catch(()=>0n)));

    let ready = 0;
    const summary = [];
    for (let i = 0; i < wallets.length; i++) {
      const value = bals[i] - gas.gasCost;
      summary.push(`${wallets[i].address.slice(0,6)}=${ethers.formatEther(bals[i])}`);
      if (value > 0n) ready++;
    }

    if (!ready) {
      const key = "wait:" + summary.join(",");
      if (key !== lastStatusKey) {
        log(`⏳ Menunggu saldo. [${summary.join(", ")}]`, "warn");
        lastStatusKey = key;
      }
      setStatus("⏳ Menunggu saldo", true);
      return;
    }

    lastStatusKey = "";
    setStatus(`⚙ Mengirim ${ready} wallet...`, true);
    await kirimSemua(to, net);
  } catch (e) {
    const key = "err:" + (e.shortMessage || e.message);
    if (key !== lastStatusKey) {
      log("✗ Loop error: " + (e.shortMessage || e.message), "err");
      lastStatusKey = key;
    }
    setStatus("✗ Error — retry...", true);
    if (e.code === "NETWORK_ERROR" || /network|fetch|timeout/i.test(e.message)) {
      try { provider.destroy?.(); } catch {}
      provider = null;
      gasCache = { data:null, ts:0 };
    }
  } finally {
    loopBusy = false;
  }
}

/* =========================================================
   START / STOP
   ========================================================= */
async function startAuto() {
  if (autoRunning) return;
  const pks = parsePKs();
  const to = $('to').value.trim();
  if (!pks.length) return log("✗ Isi minimal 1 private key.", "err");
  if (!ethers.isAddress(to)) return log("✗ Alamat tujuan tidak valid.", "err");
  if (!$('autoConfirm').checked) return log("✗ Aktifkan 'Kirim tanpa konfirmasi'.", "err");

  reset();
  autoRunning = true;
  $('btnStart').disabled = true;
  $('btnStop').disabled = false;
  $('btnOnce').disabled = true;

  try {
    await ensureConn();
  } catch (e) {
    log("✗ Koneksi gagal: " + e.message, "err");
    autoRunning = false; $('btnStart').disabled = false; $('btnStop').disabled = true; $('btnOnce').disabled = false;
    return;
  }

  const mode = $('mode').value;
  const net = cfg();

  if (mode === "ws") {
    setStatus("▶ Menyambung WSS...", true);
    wsProvider = await pilihWs(net);
    if (!wsProvider) {
      log("⚠ WSS gagal — fallback ke polling.", "warn");
    } else {
      wsProvider.on("block", async (bn) => {
        if (!autoRunning) return;
        lastBlock = BigInt(bn);
        loopTick();
      });
      log("▶ WSS aktif — kirim tiap blok baru.", "ok");
    }
  }

  const iv = getInterval();
  log(`▶ AUTO START — ${pks.length} wallet, mode=${wsProvider ? "WSS+poll" : "poll"}, interval=${iv}ms`, "ok");
  setStatus("▶ Berjalan...", true);

  loopId = setInterval(loopTick, iv);
  loopTick();
}

async function stopAuto() {
  if (!autoRunning) return;
  autoRunning = false;
  if (loopId) { clearInterval(loopId); loopId = null; }
  if (wsProvider) {
    try { await wsProvider.destroy(); } catch {}
    wsProvider = null;
  }
  $('btnStart').disabled = false;
  $('btnStop').disabled = true;
  $('btnOnce').disabled = false;

  if ($('cancelOnStop').checked) {
    log("■ AUTO STOP — membatalkan pending...", "warn");
    setStatus("■ Membatalkan pending...", false);
    await cancelPending();
  } else {
    log("■ AUTO STOP (manual).", "warn");
  }
  setStatus("■ Berhenti", false);
}

/* =========================================================
   REFRESH SALDO — hanya untuk UI, tidak dipanggil di loop
   ========================================================= */
async function refreshSaldo(force) {
  const now = Date.now();
  if (!force && now - lastUiRefresh < 5000) return;
  lastUiRefresh = now;
  try {
    await ensureConn();
    const net = cfg();
    const gas = await hitungGas();
    let html = `<div class="small">Gas: ${gas.mode} | maxFee ≈ ${ethers.formatUnits(gas.maxFee,"gwei")} gwei | gasCost ≈ ${ethers.formatEther(gas.gasCost)} ${net.symbol}</div>`;
    for (const item of wallets) {
      const bal = await provider.getBalance(item.address).catch(()=>0n);
      const max = bal - gas.gasCost;
      html += `<div class="saldo wallet-card">
        <b>${item.address}</b><br>
        Saldo: <b>${ethers.formatEther(bal)} ${net.symbol}</b><br>
        MAX  : <b class="${max>0n?'ok':'err'}">${max>0n ? ethers.formatEther(max)+' '+net.symbol : 'tidak cukup'}</b>
      </div>`;
    }
    $('saldoBox').innerHTML = html;
  } catch {}
}

/* =========================================================
   EVENTS
   ========================================================= */
$('net').addEventListener('change', async () => {
  try { provider?.destroy?.(); } catch {}
  try { await wsProvider?.destroy?.(); } catch {}
  provider = null; wsProvider = null;
  wallets = []; pksCache = ""; pendingTx.clear(); localNonce.clear();
  gasCache = { data:null, ts:0 };
  refreshSaldo(true);
});
$('pk').addEventListener('blur', () => {
  pksCache = ""; wallets = []; pendingTx.clear(); localNonce.clear();
  refreshSaldo(true);
});

// refresh UI hanya saat idle
setInterval(() => { if (!autoRunning) refreshSaldo(false); }, 5000);
</script>
</body>
</html>
