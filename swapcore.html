<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simple Swap - Import Token & Approve</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #fff;
            font-size: 26px;
            margin-bottom: 4px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .subtitle {
            color: #888;
            text-align: center;
            font-size: 12px;
            margin-bottom: 24px;
        }

        .network-badge {
            display: inline-block;
            background: #4CAF50;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .swap-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .token-input {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        .token-input:focus-within {
            border-color: #4CAF50;
        }

        .token-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 12px;
            color: #aaa;
        }

        .token-input-field {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .token-input-field input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 28px;
            font-weight: 600;
            outline: none;
        }

        .token-input-field input::placeholder {
            color: #444;
        }

        .token-select {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 14px;
        }

        .token-select:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .swap-arrow {
            text-align: center;
            font-size: 28px;
            margin: 8px 0;
            cursor: pointer;
            color: #4CAF50;
            transition: transform 0.2s;
        }

        .swap-arrow:hover {
            transform: scale(1.1);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 13px;
            color: #aaa;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 12px;
        }

        .slippage-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .slippage-control label {
            font-size: 13px;
            color: #aaa;
        }

        .slippage-control input {
            width: 80px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            color: white;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .connect-btn {
            background: linear-gradient(135deg, #2196F3, #1976D2);
        }

        .approve-btn {
            background: linear-gradient(135deg, #FF9800, #F57C00);
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 16px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            color: #4CAF50;
            display: block;
        }

        .status.error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff8888;
            display: block;
        }

        .status.loading {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196F3;
            color: #2196F3;
            display: block;
        }

        .wallet-info {
            background: rgba(33, 150, 243, 0.1);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #64b5f6;
            text-align: center;
            word-break: break-all;
        }

        .balance-display {
            font-size: 11px;
            color: #888;
            margin-top: 8px;
            cursor: pointer;
        }

        .balance-display:hover {
            color: #4CAF50;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal Style */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 28px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: white;
            margin-bottom: 16px;
        }

        .modal-content input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            color: white;
            margin-bottom: 16px;
        }

        .token-item {
            padding: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            color: white;
            display: flex;
            justify-content: space-between;
            transition: background 0.2s;
        }

        .token-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .import-btn {
            background: #2196F3;
            margin-top: 16px;
        }

        .close-btn {
            background: #333;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        🔄 Simple Swap
        <span class="network-badge">Core Chain</span>
    </h1>
    <div class="subtitle">Import Token Manual | Approve Dulu Baru Swap</div>

    <button id="connectWallet" class="connect-btn">🔌 Connect Wallet (MetaMask)</button>
    <div id="walletStatus" style="display: none;" class="wallet-info"></div>

    <div id="swapUI" style="display: none;">
        <div class="swap-box">
            <!-- FROM Token -->
            <div class="token-input">
                <div class="token-label">
                    <span>From</span>
                    <span id="fromBalance" class="balance-display">Balance: -</span>
                </div>
                <div class="token-input-field">
                    <input type="number" id="fromAmount" placeholder="0.0" value="">
                    <div id="fromTokenSelect" class="token-select">
                        <span>💰</span>
                        <span id="fromTokenSymbol">CORE</span>
                        <span>▼</span>
                    </div>
                </div>
            </div>

            <!-- Swap Arrow -->
            <div class="swap-arrow" id="swapArrow">↓ ↑</div>

            <!-- TO Token -->
            <div class="token-input">
                <div class="token-label">
                    <span>To</span>
                    <span id="toBalance" class="balance-display">Balance: -</span>
                </div>
                <div class="token-input-field">
                    <input type="number" id="toAmount" placeholder="0.0" value="" readonly disabled>
                    <div id="toTokenSelect" class="token-select">
                        <span>🪙</span>
                        <span id="toTokenSymbol">Select</span>
                        <span>▼</span>
                    </div>
                </div>
            </div>

            <!-- Slippage -->
            <div class="slippage-control">
                <label>⏱️ Slippage Tolerance</label>
                <input type="number" id="slippage" value="0.5" step="0.1">
                <span>%</span>
            </div>

            <!-- Estimated Output -->
            <div class="info-row">
                <span>📊 Estimated Received</span>
                <span id="estimatedOutput">0.00</span>
            </div>

            <div class="info-row">
                <span>🔄 Route</span>
                <span id="route">CORE → Token</span>
            </div>
        </div>

        <!-- Tombol Approve (muncul jika perlu) -->
        <button id="approveBtn" class="approve-btn" style="display: none;">✅ Approve Token</button>
        
        <!-- Tombol Swap -->
        <button id="swapBtn">🔄 Swap</button>
    </div>

    <div id="statusMessage" class="status"></div>
</div>

<!-- Modal Pilih/Import Token -->
<div id="tokenModal" class="modal">
    <div class="modal-content">
        <h3>📋 Pilih Token</h3>
        
        <!-- Daftar token default -->
        <div id="defaultTokenList"></div>
        
        <!-- Form Import Token Manual -->
        <div style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 16px;">
            <h4 style="color: #FF9800; margin-bottom: 12px;">➕ Import Token Manual</h4>
            <input type="text" id="importAddress" placeholder="Alamat Kontrak Token (0x...)">
            <input type="text" id="importSymbol" placeholder="Symbol (contoh: TOKEN)">
            <button id="importTokenBtn" class="import-btn">📥 Import Token</button>
        </div>
        
        <button id="closeModalBtn" class="close-btn" style="margin-top: 16px;">Tutup</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.1/ethers.umd.min.js"></script>
<script>
    // ============ KONFIGURASI ============
    const CORE_CHAIN_ID = "0x45c";
    const ROUTER_ADDRESS = "0xc885C4a8B112B8a165338566421c685024Ec44F9";
    const WCORE_ADDRESS = "0x40375c92d9faf44d2f9db9bd9ba41a3317a2404f";

    // Token default
    let TOKENS = {
        "CORE": {
            address: "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE",
            symbol: "CORE",
            decimals: 18,
            isNative: true
        },
        "WCORE": {
            address: WCORE_ADDRESS,
            symbol: "WCORE",
            decimals: 18,
            isNative: false
        }
    };

    // Router ABI
    const ROUTER_ABI = [
        "function swapExactTokensForTokens(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) external returns (uint[] memory amounts)",
        "function swapExactETHForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) external payable returns (uint[] memory amounts)",
        "function swapExactTokensForETH(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) external returns (uint[] memory amounts)",
        "function getAmountsOut(uint amountIn, address[] calldata path) external view returns (uint[] memory amounts)"
    ];

    const ERC20_ABI = [
        "function approve(address spender, uint256 amount) external returns (bool)",
        "function allowance(address owner, address spender) external view returns (uint256)",
        "function balanceOf(address account) external view returns (uint256)",
        "function decimals() external view returns (uint8)",
        "function symbol() external view returns (string)"
    ];

    let provider, signer, userAddress;
    let isConnected = false;
    let fromToken = TOKENS["CORE"];
    let toToken = TOKENS["WCORE"];
    let currentAllowance = "0";
    let currentSelecting = 'from';

    // DOM Elements
    const connectBtn = document.getElementById('connectWallet');
    const walletStatusDiv = document.getElementById('walletStatus');
    const swapUI = document.getElementById('swapUI');
    const statusDiv = document.getElementById('statusMessage');
    const swapBtn = document.getElementById('swapBtn');
    const approveBtn = document.getElementById('approveBtn');
    const fromAmountInput = document.getElementById('fromAmount');
    const toAmountInput = document.getElementById('toAmount');
    const fromTokenSymbolSpan = document.getElementById('fromTokenSymbol');
    const toTokenSymbolSpan = document.getElementById('toTokenSymbol');
    const fromBalanceSpan = document.getElementById('fromBalance');
    const toBalanceSpan = document.getElementById('toBalance');
    const estimatedOutputSpan = document.getElementById('estimatedOutput');
    const routeSpan = document.getElementById('route');
    const slippageInput = document.getElementById('slippage');
    const swapArrow = document.getElementById('swapArrow');
    const tokenModal = document.getElementById('tokenModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const importAddress = document.getElementById('importAddress');
    const importSymbol = document.getElementById('importSymbol');
    const importTokenBtn = document.getElementById('importTokenBtn');
    const defaultTokenList = document.getElementById('defaultTokenList');

    function showStatus(msg, type = 'loading') {
        statusDiv.innerHTML = type === 'loading' ? `<span class="loading-spinner"></span> ${msg}` : msg;
        statusDiv.className = `status ${type}`;
        if (type !== 'loading') {
            setTimeout(() => {
                if (statusDiv.className === `status ${type}`) statusDiv.style.display = 'none';
            }, 6000);
        }
    }

    async function ensureCoreNetwork() {
        if (!window.ethereum) throw new Error('MetaMask tidak terinstall!');
        const chainId = await window.ethereum.request({ method: 'eth_chainId' });
        if (chainId !== CORE_CHAIN_ID) {
            showStatus('Switch ke Core Chain...', 'loading');
            try {
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CORE_CHAIN_ID }] });
            } catch(e) {
                if (e.code === 4902) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: CORE_CHAIN_ID,
                            chainName: 'Core Chain',
                            nativeCurrency: { name: 'CORE', symbol: 'CORE', decimals: 18 },
                            rpcUrls: ['https://rpc.coredao.org'],
                            blockExplorerUrls: ['https://scan.coredao.org']
                        }]
                    });
                } else throw e;
            }
        }
    }

    async function updateBalances() {
        if (!isConnected) return;
        
        try {
            // Update FROM balance
            if (fromToken.isNative) {
                const balance = await provider.getBalance(userAddress);
                fromBalanceSpan.innerHTML = `Balance: ${parseFloat(ethers.utils.formatEther(balance)).toFixed(4)} ${fromToken.symbol}`;
            } else {
                const tokenContract = new ethers.Contract(fromToken.address, ERC20_ABI, provider);
                const balance = await tokenContract.balanceOf(userAddress);
                fromBalanceSpan.innerHTML = `Balance: ${parseFloat(ethers.utils.formatUnits(balance, fromToken.decimals)).toFixed(4)} ${fromToken.symbol}`;
            }
            
            // Update TO balance
            if (toToken.isNative) {
                const balance = await provider.getBalance(userAddress);
                toBalanceSpan.innerHTML = `Balance: ${parseFloat(ethers.utils.formatEther(balance)).toFixed(4)} ${toToken.symbol}`;
            } else {
                const tokenContract = new ethers.Contract(toToken.address, ERC20_ABI, provider);
                const balance = await tokenContract.balanceOf(userAddress);
                toBalanceSpan.innerHTML = `Balance: ${parseFloat(ethers.utils.formatUnits(balance, toToken.decimals)).toFixed(4)} ${toToken.symbol}`;
            }
            
            // Check allowance if from token is not native
            if (!fromToken.isNative) {
                const tokenContract = new ethers.Contract(fromToken.address, ERC20_ABI, signer);
                const allowance = await tokenContract.allowance(userAddress, ROUTER_ADDRESS);
                currentAllowance = ethers.utils.formatUnits(allowance, fromToken.decimals);
                
                const amountIn = parseFloat(fromAmountInput.value) || 0;
                if (amountIn > 0 && amountIn > parseFloat(currentAllowance)) {
                    approveBtn.style.display = 'block';
                    swapBtn.disabled = true;
                } else {
                    approveBtn.style.display = 'none';
                    swapBtn.disabled = false;
                }
            } else {
                approveBtn.style.display = 'none';
                swapBtn.disabled = false;
            }
        } catch(err) {
            console.error("Update balance error:", err);
        }
    }

    async function estimateOutput() {
        const amountIn = parseFloat(fromAmountInput.value);
        if (!amountIn || amountIn <= 0 || !isConnected) {
            estimatedOutputSpan.innerHTML = "0.00";
            toAmountInput.value = "";
            return;
        }
        
        try {
            const path = getPath();
            const amountInWei = fromToken.isNative ? 
                ethers.utils.parseEther(amountIn.toString()) :
                ethers.utils.parseUnits(amountIn.toString(), fromToken.decimals);
            
            const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, provider);
            const amounts = await router.getAmountsOut(amountInWei, path);
            const outputAmount = amounts[amounts.length - 1];
            
            const outputFormatted = ethers.utils.formatUnits(outputAmount, toToken.decimals);
            estimatedOutputSpan.innerHTML = parseFloat(outputFormatted).toFixed(6);
            toAmountInput.value = parseFloat(outputFormatted).toFixed(6);
        } catch(err) {
            estimatedOutputSpan.innerHTML = "0.00";
            toAmountInput.value = "";
        }
    }

    function getPath() {
        let tokenIn = fromToken.isNative ? WCORE_ADDRESS : fromToken.address;
        let tokenOut = toToken.isNative ? WCORE_ADDRESS : toToken.address;
        
        if (fromToken.isNative || toToken.isNative) {
            return [tokenIn, tokenOut];
        } else {
            return [fromToken.address, WCORE_ADDRESS, toToken.address];
        }
    }

    async function approveToken() {
        if (fromToken.isNative) {
            showStatus("CORE tidak perlu approve!", 'error');
            return;
        }
        
        const amountIn = parseFloat(fromAmountInput.value);
        if (!amountIn || amountIn <= 0) {
            showStatus("Masukkan jumlah token yang akan di-swap terlebih dahulu!", 'error');
            return;
        }
        
        showStatus(`Menyetujui ${fromToken.symbol} untuk ditukar...`, 'loading');
        approveBtn.disabled = true;
        
        try {
            const tokenContract = new ethers.Contract(fromToken.address, ERC20_ABI, signer);
            const amountInWei = ethers.utils.parseUnits(amountIn.toString(), fromToken.decimals);
            
            // Approve dengan jumlah yang cukup (plus buffer 10%)
            const approveAmount = amountInWei.mul(110).div(100);
            
            const tx = await tokenContract.approve(ROUTER_ADDRESS, approveAmount);
            await tx.wait();
            showStatus(`✅ Approve ${fromToken.symbol} berhasil! Sekarang bisa swap.`, 'success');
            await updateBalances();
        } catch(err) {
            showStatus(`Approve gagal: ${err.message.slice(0,100)}`, 'error');
        } finally {
            approveBtn.disabled = false;
        }
    }

    async function executeSwap() {
        const amountIn = parseFloat(fromAmountInput.value);
        if (!amountIn || amountIn <= 0) {
            showStatus("Masukkan jumlah token!", 'error');
            return;
        }
        
        // Cek allowance lagi sebelum swap
        if (!fromToken.isNative) {
            const tokenContract = new ethers.Contract(fromToken.address, ERC20_ABI, signer);
            const allowance = await tokenContract.allowance(userAddress, ROUTER_ADDRESS);
            const amountInWei = ethers.utils.parseUnits(amountIn.toString(), fromToken.decimals);
            
            if (allowance.lt(amountInWei)) {
                showStatus(`Harap approve ${fromToken.symbol} terlebih dahulu!`, 'error');
                return;
            }
        }
        
        const slippage = parseFloat(slippageInput.value) / 100;
        const path = getPath();
        const deadline = Math.floor(Date.now() / 1000) + 1200;
        
        showStatus(`Menukar ${amountIn} ${fromToken.symbol} → ${toToken.symbol}...`, 'loading');
        swapBtn.disabled = true;
        
        try {
            const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
            const amountInWei = fromToken.isNative ? 
                ethers.utils.parseEther(amountIn.toString()) :
                ethers.utils.parseUnits(amountIn.toString(), fromToken.decimals);
            
            const amounts = await router.getAmountsOut(amountInWei, path);
            const expectedOutput = amounts[amounts.length - 1];
            const minOutput = expectedOutput.mul(Math.floor((1 - slippage) * 1000)).div(1000);
            
            let tx;
            
            if (fromToken.isNative) {
                tx = await router.swapExactETHForTokens(
                    minOutput,
                    path,
                    userAddress,
                    deadline,
                    { value: amountInWei }
                );
            } else if (toToken.isNative) {
                tx = await router.swapExactTokensForETH(
                    amountInWei,
                    minOutput,
                    path,
                    userAddress,
                    deadline
                );
            } else {
                tx = await router.swapExactTokensForTokens(
                    amountInWei,
                    minOutput,
                    path,
                    userAddress,
                    deadline
                );
            }
            
            showStatus('Menunggu konfirmasi di blockchain...', 'loading');
            const receipt = await tx.wait();
            
            if (receipt.status === 1) {
                showStatus(`✅ Swap berhasil! Tx: ${receipt.transactionHash.slice(0,10)}...`, 'success');
                fromAmountInput.value = '';
                toAmountInput.value = '';
                await updateBalances();
                estimateOutput();
            } else {
                throw new Error('Transaksi gagal');
            }
        } catch(err) {
            let msg = err.message;
            if (msg.includes('INSUFFICIENT_OUTPUT_AMOUNT')) {
                msg = 'Slippage terlalu kecil! Coba naikkan slippage.';
            } else if (msg.includes('INSUFFICIENT_A_AMOUNT')) {
                msg = 'Saldo token tidak cukup!';
            }
            showStatus(`Swap gagal: ${msg.slice(0,100)}`, 'error');
        } finally {
            swapBtn.disabled = false;
        }
    }

    // Import token manual
    async function importToken() {
        const address = importAddress.value.trim();
        const customSymbol = importSymbol.value.trim();
        
        if (!address || !ethers.utils.isAddress(address)) {
            showStatus("Masukkan alamat token yang valid (0x...)", 'error');
            return;
        }
        
        showStatus("Mengimpor token...", 'loading');
        
        try {
            const tokenContract = new ethers.Contract(address, ERC20_ABI, provider);
            let symbol = customSymbol;
            let decimals = 18;
            
            if (!symbol) {
                symbol = await tokenContract.symbol();
            }
            decimals = await tokenContract.decimals();
            
            const newToken = {
                address: address,
                symbol: symbol,
                decimals: decimals,
                isNative: false
            };
            
            TOKENS[symbol] = newToken;
            
            showStatus(`✅ Token ${symbol} berhasil diimport!`, 'success');
            importAddress.value = '';
            importSymbol.value = '';
            
            renderTokenList();
            
            // Jika sedang memilih token, set ke token yang baru diimport
            if (currentSelecting === 'from') {
                fromToken = newToken;
                fromTokenSymbolSpan.innerHTML = symbol;
            } else {
                toToken = newToken;
                toTokenSymbolSpan.innerHTML = symbol;
            }
            
            routeSpan.innerHTML = `${fromToken.symbol} → ${toToken.symbol}`;
            tokenModal.style.display = 'none';
            updateBalances();
            estimateOutput();
            
        } catch(err) {
            showStatus(`Gagal import token: ${err.message.slice(0,100)}`, 'error');
        }
    }

    function renderTokenList() {
        defaultTokenList.innerHTML = '';
        
        Object.keys(TOKENS).forEach(symbol => {
            const token = TOKENS[symbol];
            const div = document.createElement('div');
            div.className = 'token-item';
            div.innerHTML = `
                <span><strong>${token.symbol}</strong> ${token.isNative ? '(Native)' : ''}</span>
                <span style="color:#888; font-size:11px;">${token.address.slice(0,6)}...${token.address.slice(-4)}</span>
            `;
            div.onclick = () => {
                if (currentSelecting === 'from') {
                    fromToken = token;
                    fromTokenSymbolSpan.innerHTML = token.symbol;
                } else {
                    toToken = token;
                    toTokenSymbolSpan.innerHTML = token.symbol;
                }
                tokenModal.style.display = 'none';
                routeSpan.innerHTML = `${fromToken.symbol} → ${toToken.symbol}`;
                updateBalances();
                estimateOutput();
            };
            defaultTokenList.appendChild(div);
        });
    }

    function showTokenSelector(selectType) {
        currentSelecting = selectType;
        renderTokenList();
        tokenModal.style.display = 'flex';
    }

    async function connectWallet() {
        try {
            if (!window.ethereum) { alert("Install MetaMask!"); return; }
            await ensureCoreNetwork();
            provider = new ethers.providers.Web3Provider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            userAddress = accounts[0];
            signer = provider.getSigner();
            isConnected = true;
            
            connectBtn.textContent = '✅ Connected';
            connectBtn.disabled = true;
            walletStatusDiv.style.display = 'block';
            walletStatusDiv.innerHTML = `🔗 ${userAddress.slice(0,8)}...${userAddress.slice(-6)}<br>🌐 Core Chain (1116)`;
            swapUI.style.display = 'block';
            
            await updateBalances();
            
            window.ethereum.on('accountsChanged', () => window.location.reload());
            window.ethereum.on('chainChanged', () => window.location.reload());
        } catch(err) {
            showStatus(err.message, 'error');
        }
    }

    // Event Listeners
    connectBtn.addEventListener('click', connectWallet);
    swapBtn.addEventListener('click', executeSwap);
    approveBtn.addEventListener('click', approveToken);
    fromAmountInput.addEventListener('input', () => estimateOutput());
    swapArrow.addEventListener('click', () => {
        const temp = fromToken;
        fromToken = toToken;
        toToken = temp;
        fromTokenSymbolSpan.innerHTML = fromToken.symbol;
        toTokenSymbolSpan.innerHTML = toToken.symbol;
        routeSpan.innerHTML = `${fromToken.symbol} → ${toToken.symbol}`;
        fromAmountInput.value = '';
        toAmountInput.value = '';
        updateBalances();
        estimateOutput();
    });
    
    fromTokenSymbolSpan.parentElement.onclick = () => showTokenSelector('from');
    toTokenSymbolSpan.parentElement.onclick = () => showTokenSelector('to');
    closeModalBtn.onclick = () => tokenModal.style.display = 'none';
    importTokenBtn.onclick = importToken;
</script>
</body>
</html>
