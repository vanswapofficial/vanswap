<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simple Swap - Core Chain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
 justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(20, 20, 35, 0.95);
            border-radius: 32px;
            padding: 24px;
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #fff;
            font-size: 26px;
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            color: #888;
            text-align: center;
            font-size: 12px;
            margin-bottom: 24px;
        }

        .network-badge {
            display: inline-block;
            background: #4CAF50;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
        }

        .import-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        .import-title {
            color: #FF9800;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .import-input-group {
            margin-bottom: 12px;
        }

        .import-input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: white;
            font-size: 14px;
        }

        .import-input-group input:focus {
            outline: none;
            border-color: #FF9800;
        }

        .import-input-group label {
            display: block;
            color: #aaa;
            font-size: 11px;
            margin-bottom: 6px;
        }

        .row-2col {
            display: flex;
            gap: 12px;
        }

        .row-2col > div {
            flex: 1;
        }

        .import-btn {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .token-list {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .token-list-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        .token-item {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .token-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .token-item .symbol {
            font-weight: bold;
            color: white;
        }

        .token-item .address {
            font-size: 10px;
            color: #888;
        }

        .swap-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .token-input {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .token-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 12px;
            color: #aaa;
        }

        .token-input-field {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .token-input-field input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 28px;
            font-weight: 600;
            outline: none;
        }

        .token-select {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .swap-arrow {
            text-align: center;
            font-size: 28px;
            margin: 8px 0;
            cursor: pointer;
            color: #4CAF50;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 13px;
            color: #aaa;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 12px;
        }

        .slippage-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .slippage-control input {
            width: 80px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            color: white;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .connect-btn {
            background: linear-gradient(135deg, #2196F3, #1976D2);
        }

        .approve-btn {
            background: linear-gradient(135deg, #FF9800, #F57C00);
        }

        .swap-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 16px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            color: #4CAF50;
            display: block;
        }

        .status.error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff8888;
            display: block;
        }

        .status.loading {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196F3;
            color: #2196F3;
            display: block;
        }

        .wallet-info {
            background: rgba(33, 150, 243, 0.1);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #64b5f6;
            text-align: center;
        }

        .balance-display {
            font-size: 11px;
            color: #888;
            cursor: pointer;
        }

        .balance-display:hover {
            color: #4CAF50;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔄 Simple Swap <span class="network-badge">Core Chain</span></h1>
    <div class="subtitle">Import Token | Approve | Swap</div>

    <button id="connectWallet" class="connect-btn">🔌 Connect Wallet</button>
    <div id="walletStatus" style="display: none;" class="wallet-info"></div>

    <div id="swapUI" style="display: none;">
        <!-- IMPORT TOKEN -->
        <div class="import-section">
            <div class="import-title">➕ Import Token Manual</div>
            <div class="import-input-group">
                <label>Alamat Kontrak</label>
                <input type="text" id="importAddress" placeholder="0x...">
            </div>
            <div class="row-2col">
                <div>
                    <label>Symbol</label>
                    <input type="text" id="importSymbol" placeholder="Opsional">
                </div>
                <div>
                    <label>Decimals</label>
                    <input type="text" id="importDecimals" placeholder="Auto">
                </div>
            </div>
            <button id="importBtn" class="import-btn">📥 Import Token</button>
            
            <div class="token-list">
                <div class="token-list-title">📋 Daftar Token (klik untuk pilih FROM)</div>
                <div id="tokenList"></div>
                <div style="margin-top: 8px;">
                    <button id="selectToTokenBtn" style="background: #4CAF50; padding: 10px; font-size: 13px;">🎯 Klik untuk pilih TOKEN TUJUAN</button>
                </div>
            </div>
        </div>

        <!-- SWAP BOX -->
        <div class="swap-box">
            <div class="token-input">
                <div class="token-label">
                    <span>📤 FROM (Yang kamu tukar)</span>
                    <span id="fromBalance" class="balance-display">Balance: -</span>
                </div>
                <div class="token-input-field">
                    <input type="number" id="fromAmount" placeholder="0.0">
                    <div id="fromTokenSelect" class="token-select">
                        <span>💰</span>
                        <span id="fromTokenSymbol">CORE</span>
                        <span>▼</span>
                    </div>
                </div>
            </div>

            <div class="swap-arrow" id="swapArrow">↓ ↑</div>

            <div class="token-input">
                <div class="token-label">
                    <span>📥 TO (Yang kamu terima)</span>
                    <span id="toBalance" class="balance-display">Balance: -</span>
                </div>
                <div class="token-input-field">
                    <input type="text" id="toAmount" placeholder="0.0" readonly disabled>
                    <div id="toTokenSelect" class="token-select">
                        <span>🪙</span>
                        <span id="toTokenSymbol">Pilih</span>
                        <span>▼</span>
                    </div>
                </div>
            </div>

            <div class="slippage-control">
                <span>⏱️ Slippage</span>
                <input type="number" id="slippage" value="0.5" step="0.1">
                <span>%</span>
            </div>

            <div class="info-row">
                <span>📊 Perkiraan Diterima</span>
                <span id="estimatedOutput">0.00</span>
            </div>
        </div>

        <button id="approveBtn" class="approve-btn" style="display: none;">✅ Approve Token</button>
        <button id="swapBtn" class="swap-btn">🔄 SWAP</button>
    </div>

    <div id="statusMessage" class="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.1/ethers.umd.min.js"></script>
<script>
    // KONFIGURASI
    const CORE_CHAIN_ID = "0x45c";
    const ROUTER_ADDRESS = "0xc885C4a8B112B8a165338566421c685024Ec44F9";
    const WCORE_ADDRESS = "0x40375c92d9faf44d2f9db9bd9ba41a3317a2404f";

    // TOKENS
    let TOKENS = {
        "CORE": {
            address: "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE",
            symbol: "CORE",
            decimals: 18,
            isNative: true
        },
        "WCORE": {
            address: WCORE_ADDRESS,
            symbol: "WCORE",
            decimals: 18,
            isNative: false
        }
    };

    // ABI
    const ROUTER_ABI = [
        "function swapExactTokensForTokens(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) external returns (uint[] memory amounts)",
        "function swapExactETHForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) external payable returns (uint[] memory amounts)",
        "function swapExactTokensForETH(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) external returns (uint[] memory amounts)",
        "function getAmountsOut(uint amountIn, address[] calldata path) external view returns (uint[] memory amounts)"
    ];

    const ERC20_ABI = [
        "function approve(address spender, uint256 amount) external returns (bool)",
        "function allowance(address owner, address spender) external view returns (uint256)",
        "function balanceOf(address account) external view returns (uint256)",
        "function decimals() external view returns (uint8)",
        "function symbol() external view returns (string)"
    ];

    let provider, signer, userAddress;
    let isConnected = false;
    let fromToken = TOKENS["CORE"];
    let toToken = TOKENS["WCORE"];

    // DOM
    const connectBtn = document.getElementById('connectWallet');
    const walletStatusDiv = document.getElementById('walletStatus');
    const swapUI = document.getElementById('swapUI');
    const statusDiv = document.getElementById('statusMessage');
    const swapBtn = document.getElementById('swapBtn');
    const approveBtn = document.getElementById('approveBtn');
    const fromAmount = document.getElementById('fromAmount');
    const toAmount = document.getElementById('toAmount');
    const fromTokenSymbol = document.getElementById('fromTokenSymbol');
    const toTokenSymbol = document.getElementById('toTokenSymbol');
    const fromBalanceSpan = document.getElementById('fromBalance');
    const toBalanceSpan = document.getElementById('toBalance');
    const estimatedOutputSpan = document.getElementById('estimatedOutput');
    const slippageInput = document.getElementById('slippage');
    const swapArrow = document.getElementById('swapArrow');
    const importAddress = document.getElementById('importAddress');
    const importSymbol = document.getElementById('importSymbol');
    const importDecimals = document.getElementById('importDecimals');
    const importBtn = document.getElementById('importBtn');
    const tokenListDiv = document.getElementById('tokenList');
    const selectToTokenBtn = document.getElementById('selectToTokenBtn');

    function showStatus(msg, type = 'loading') {
        statusDiv.innerHTML = type === 'loading' ? `<span class="loading-spinner"></span> ${msg}` : msg;
        statusDiv.className = `status ${type}`;
        if (type !== 'loading') {
            setTimeout(() => {
                if (statusDiv.className === `status ${type}`) statusDiv.style.display = 'none';
            }, 6000);
        }
    }

    async function ensureCoreNetwork() {
        if (!window.ethereum) throw new Error('MetaMask tidak terinstall!');
        const chainId = await window.ethereum.request({ method: 'eth_chainId' });
        if (chainId !== CORE_CHAIN_ID) {
            showStatus('Switch ke Core Chain...', 'loading');
            try {
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CORE_CHAIN_ID }] });
            } catch(e) {
                if (e.code === 4902) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: CORE_CHAIN_ID,
                            chainName: 'Core Chain',
                            nativeCurrency: { name: 'CORE', symbol: 'CORE', decimals: 18 },
                            rpcUrls: ['https://rpc.coredao.org'],
                            blockExplorerUrls: ['https://scan.coredao.org']
                        }]
                    });
                } else throw e;
            }
        }
    }

    async function updateBalances() {
        if (!isConnected) return;
        try {
            // FROM balance
            if (fromToken.isNative) {
                let bal = await provider.getBalance(userAddress);
                fromBalanceSpan.innerHTML = `Balance: ${parseFloat(ethers.utils.formatEther(bal)).toFixed(4)} ${fromToken.symbol}`;
            } else {
                let contract = new ethers.Contract(fromToken.address, ERC20_ABI, provider);
                let bal = await contract.balanceOf(userAddress);
                fromBalanceSpan.innerHTML = `Balance: ${parseFloat(ethers.utils.formatUnits(bal, fromToken.decimals)).toFixed(4)} ${fromToken.symbol}`;
            }
            // TO balance
            if (toToken && toToken.address) {
                if (toToken.isNative) {
                    let bal = await provider.getBalance(userAddress);
                    toBalanceSpan.innerHTML = `Balance: ${parseFloat(ethers.utils.formatEther(bal)).toFixed(4)} ${toToken.symbol}`;
                } else {
                    let contract = new ethers.Contract(toToken.address, ERC20_ABI, provider);
                    let bal = await contract.balanceOf(userAddress);
                    toBalanceSpan.innerHTML = `Balance: ${parseFloat(ethers.utils.formatUnits(bal, toToken.decimals)).toFixed(4)} ${toToken.symbol}`;
                }
            }
        } catch(e) { console.error(e); }
    }

    async function estimateOutput() {
        let amount = parseFloat(fromAmount.value);
        if (!amount || amount <= 0 || !toToken || toToken.symbol === 'Pilih') {
            estimatedOutputSpan.innerHTML = "0.00";
            toAmount.value = "";
            return;
        }
        try {
            let tokenIn = fromToken.isNative ? WCORE_ADDRESS : fromToken.address;
            let tokenOut = toToken.isNative ? WCORE_ADDRESS : toToken.address;
            let path = [tokenIn, tokenOut];
            let amountInWei = fromToken.isNative ? ethers.utils.parseEther(amount.toString()) : ethers.utils.parseUnits(amount.toString(), fromToken.decimals);
            let router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, provider);
            let amounts = await router.getAmountsOut(amountInWei, path);
            let output = ethers.utils.formatUnits(amounts[amounts.length-1], toToken.decimals);
            estimatedOutputSpan.innerHTML = parseFloat(output).toFixed(6);
            toAmount.value = parseFloat(output).toFixed(6);
        } catch(e) {
            estimatedOutputSpan.innerHTML = "0.00";
        }
    }

    async function checkAndShowApprove() {
        if (!isConnected || fromToken.isNative) {
            approveBtn.style.display = 'none';
            swapBtn.disabled = false;
            return;
        }
        let amount = parseFloat(fromAmount.value);
        if (!amount || amount <= 0) {
            approveBtn.style.display = 'none';
            swapBtn.disabled = false;
            return;
        }
        try {
            let contract = new ethers.Contract(fromToken.address, ERC20_ABI, signer);
            let allowance = await contract.allowance(userAddress, ROUTER_ADDRESS);
            let amountWei = ethers.utils.parseUnits(amount.toString(), fromToken.decimals);
            if (allowance.lt(amountWei)) {
                approveBtn.style.display = 'block';
                swapBtn.disabled = true;
            } else {
                approveBtn.style.display = 'none';
                swapBtn.disabled = false;
            }
        } catch(e) {
            approveBtn.style.display = 'block';
        }
    }

    async function approveToken() {
        if (fromToken.isNative) {
            showStatus("CORE tidak perlu approve", 'error');
            return;
        }
        let amount = parseFloat(fromAmount.value);
        if (!amount || amount <= 0) {
            showStatus("Masukkan jumlah token", 'error');
            return;
        }
        showStatus(`Menyetujui ${fromToken.symbol}...`, 'loading');
        approveBtn.disabled = true;
        try {
            let contract = new ethers.Contract(fromToken.address, ERC20_ABI, signer);
            let amountWei = ethers.utils.parseUnits(amount.toString(), fromToken.decimals);
            let tx = await contract.approve(ROUTER_ADDRESS, amountWei.mul(120).div(100));
            await tx.wait();
            showStatus(`✅ Approve ${fromToken.symbol} berhasil!`, 'success');
            await checkAndShowApprove();
        } catch(e) {
            showStatus(`Approve gagal: ${e.message.slice(0,100)}`, 'error');
        } finally {
            approveBtn.disabled = false;
        }
    }

    async function executeSwap() {
        let amount = parseFloat(fromAmount.value);
        if (!amount || amount <= 0) {
            showStatus("Masukkan jumlah token", 'error');
            return;
        }
        if (!toToken || toToken.symbol === 'Pilih') {
            showStatus("Pilih token tujuan", 'error');
            return;
        }
        // Cek allowance lagi
        if (!fromToken.isNative) {
            let contract = new ethers.Contract(fromToken.address, ERC20_ABI, signer);
            let allowance = await contract.allowance(userAddress, ROUTER_ADDRESS);
            let amountWei = ethers.utils.parseUnits(amount.toString(), fromToken.decimals);
            if (allowance.lt(amountWei)) {
                showStatus("Harap approve token terlebih dahulu!", 'error');
                return;
            }
        }
        
        let slippage = parseFloat(slippageInput.value) / 100;
        let tokenIn = fromToken.isNative ? WCORE_ADDRESS : fromToken.address;
        let tokenOut = toToken.isNative ? WCORE_ADDRESS : toToken.address;
        let path = [tokenIn, tokenOut];
        let deadline = Math.floor(Date.now() / 1000) + 1200;
        
        showStatus(`Menukar ${amount} ${fromToken.symbol} → ${toToken.symbol}...`, 'loading');
        swapBtn.disabled = true;
        
        try {
            let router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
            let amountInWei = fromToken.isNative ? ethers.utils.parseEther(amount.toString()) : ethers.utils.parseUnits(amount.toString(), fromToken.decimals);
            let amounts = await router.getAmountsOut(amountInWei, path);
            let minOutput = amounts[amounts.length-1].mul(Math.floor((1 - slippage) * 1000)).div(1000);
            
            let tx;
            if (fromToken.isNative) {
                tx = await router.swapExactETHForTokens(minOutput, path, userAddress, deadline, { value: amountInWei });
            } else if (toToken.isNative) {
                tx = await router.swapExactTokensForETH(amountInWei, minOutput, path, userAddress, deadline);
            } else {
                tx = await router.swapExactTokensForTokens(amountInWei, minOutput, path, userAddress, deadline);
            }
            
            showStatus('Menunggu konfirmasi...', 'loading');
            let receipt = await tx.wait();
            if (receipt.status === 1) {
                showStatus(`✅ Swap berhasil! Tx: ${receipt.transactionHash.slice(0,10)}...`, 'success');
                fromAmount.value = '';
                toAmount.value = '';
                await updateBalances();
                estimateOutput();
            } else {
                throw new Error('Transaksi gagal');
            }
        } catch(e) {
            let msg = e.message;
            if (msg.includes('INSUFFICIENT_OUTPUT_AMOUNT')) msg = 'Slippage terlalu kecil! Naikkan slippage.';
            showStatus(`Swap gagal: ${msg.slice(0,100)}`, 'error');
        } finally {
            swapBtn.disabled = false;
        }
    }

    function renderTokenList() {
        tokenListDiv.innerHTML = '';
        for (let symbol in TOKENS) {
            let token = TOKENS[symbol];
            let div = document.createElement('div');
            div.className = 'token-item';
            div.innerHTML = `<div><div class="symbol">${token.symbol}</div><div class="address">${token.address.slice(0,10)}...</div></div>`;
            div.onclick = () => {
                fromToken = token;
                fromTokenSymbol.innerHTML = token.symbol;
                updateBalances();
                estimateOutput();
                checkAndShowApprove();
                showStatus(`${token.symbol} dipilih sebagai FROM`, 'success');
            };
            tokenListDiv.appendChild(div);
        }
    }

    function showToTokenSelector() {
        let modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:1000;display:flex;align-items:center;justify-content:center;';
        let content = document.createElement('div');
        content.style.cssText = 'background:#1a1a2e;border-radius:28px;padding:24px;width:90%;max-width:350px;';
        content.innerHTML = '<h3 style="color:white;margin-bottom:16px;">Pilih Token Tujuan (TO)</h3>';
        
        for (let symbol in TOKENS) {
            let token = TOKENS[symbol];
            let btn = document.createElement('div');
            btn.style.cssText = 'padding:12px;border-bottom:1px solid rgba(255,255,255,0.1);cursor:pointer;color:white;display:flex;justify-content:space-between;';
            btn.innerHTML = `<span>${token.symbol}</span><span style="color:#888;">${token.address.slice(0,8)}...</span>`;
            btn.onclick = () => {
                toToken = token;
                toTokenSymbol.innerHTML = token.symbol;
                document.body.removeChild(modal);
                updateBalances();
                estimateOutput();
                showStatus(`${token.symbol} dipilih sebagai tujuan`, 'success');
            };
            content.appendChild(btn);
        }
        let closeBtn = document.createElement('button');
        closeBtn.textContent = 'Tutup';
        closeBtn.style.cssText = 'width:100%;padding:12px;background:#333;border:none;border-radius:16px;color:white;margin-top:16px;cursor:pointer;';
        closeBtn.onclick = () => document.body.removeChild(modal);
        content.appendChild(closeBtn);
        modal.appendChild(content);
        document.body.appendChild(modal);
    }

    async function importToken() {
        let address = importAddress.value.trim();
        if (!address || !ethers.utils.isAddress(address)) {
            showStatus("Masukkan alamat valid (0x...)", 'error');
            return;
        }
        showStatus("Mengimpor token...", 'loading');
        try {
            let contract = new ethers.Contract(address, ERC20_ABI, provider);
            let symbol = importSymbol.value.trim() || await contract.symbol();
            let decimals = importDecimals.value.trim() ? parseInt(importDecimals.value) : await contract.decimals();
            if (TOKENS[symbol]) {
                showStatus(`Token ${symbol} sudah ada`, 'warning');
                return;
            }
            TOKENS[symbol] = { address, symbol, decimals, isNative: false };
            renderTokenList();
            showStatus(`✅ Token ${symbol} berhasil diimport!`, 'success');
            importAddress.value = '';
            importSymbol.value = '';
            importDecimals.value = '';
        } catch(e) {
            showStatus(`Import gagal: ${e.message.slice(0,100)}`, 'error');
        }
    }

    async function connectWallet() {
        try {
            if (!window.ethereum) { alert("Install MetaMask!"); return; }
            await ensureCoreNetwork();
            provider = new ethers.providers.Web3Provider(window.ethereum);
            let accounts = await provider.send("eth_requestAccounts", []);
            userAddress = accounts[0];
            signer = provider.getSigner();
            isConnected = true;
            connectBtn.textContent = '✅ Connected';
            connectBtn.disabled = true;
            walletStatusDiv.style.display = 'block';
            walletStatusDiv.innerHTML = `🔗 ${userAddress.slice(0,8)}...${userAddress.slice(-6)}<br>🌐 Core Chain`;
            swapUI.style.display = 'block';
            renderTokenList();
            await updateBalances();
            window.ethereum.on('accountsChanged', () => window.location.reload());
            window.ethereum.on('chainChanged', () => window.location.reload());
        } catch(e) {
            showStatus(e.message, 'error');
        }
    }

    // EVENT LISTENERS
    connectBtn.addEventListener('click', connectWallet);
    swapBtn.addEventListener('click', executeSwap);
    approveBtn.addEventListener('click', approveToken);
    fromAmount.addEventListener('input', () => { estimateOutput(); checkAndShowApprove(); });
    swapArrow.addEventListener('click', () => {
        let temp = fromToken;
        fromToken = toToken;
        toToken = temp;
        fromTokenSymbol.innerHTML = fromToken.symbol;
        toTokenSymbol.innerHTML = toToken.symbol;
        fromAmount.value = '';
        toAmount.value = '';
        updateBalances();
        estimateOutput();
        checkAndShowApprove();
    });
    importBtn.addEventListener('click', importToken);
    selectToTokenBtn.addEventListener('click', showToTokenSelector);
    document.getElementById('fromTokenSelect').addEventListener('click', () => {
        // show selector for from token
        let modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:1000;display:flex;align-items:center;justify-content:center;';
        let content = document.createElement('div');
        content.style.cssText = 'background:#1a1a2e;border-radius:28px;padding:24px;width:90%;max-width:350px;max-height:70vh;overflow-y:auto;';
        content.innerHTML = '<h3 style="color:white;margin-bottom:16px;">Pilih Token Sumber (FROM)</h3>';
        for (let symbol in TOKENS) {
            let token = TOKENS[symbol];
            let btn = document.createElement('div');
            btn.style.cssText = 'padding:12px;border-bottom:1px solid rgba(255,255,255,0.1);cursor:pointer;color:white;';
            btn.innerHTML = `${token.symbol}<br><span style="font-size:10px;color:#888;">${token.address.slice(0,10)}...</span>`;
            btn.onclick = () => {
                fromToken = token;
                fromTokenSymbol.innerHTML = token.symbol;
                document.body.removeChild(modal);
                updateBalances();
                estimateOutput();
                checkAndShowApprove();
            };
            content.appendChild(btn);
        }
        let closeBtn = document.createElement('button');
        closeBtn.textContent = 'Tutup';
        closeBtn.style.cssText = 'width:100%;padding:12px;background:#333;border:none;border-radius:16px;color:white;margin-top:16px;cursor:pointer;';
        closeBtn.onclick = () => document.body.removeChild(modal);
        content.appendChild(closeBtn);
        modal.appendChild(content);
        document.body.appendChild(modal);
    });
    document.getElementById('toTokenSelect').addEventListener('click', showToTokenSelector);
</script>
</body>
</html>
